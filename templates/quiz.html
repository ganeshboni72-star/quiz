
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Logic Hunt | Quiz</title>


    
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
    --bg:#050912;
    --panel:rgba(10,19,32,.78);
    --panel2:rgba(14,27,44,.88);
    --line:rgba(104,226,255,.16);
    --text:#f4fbff;
    --muted:#8398aa;
    --cyan:#45e7ff;
    --blue:#278dff;
    --violet:#7b61ff;
    --green:#32e6a2;
    --red:#ff5874;
}

html{scroll-behavior:smooth}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 12% 8%,rgba(69,231,255,.13),transparent 25%),
        radial-gradient(circle at 88% 15%,rgba(123,97,255,.14),transparent 27%),
        radial-gradient(circle at 50% 100%,rgba(39,141,255,.10),transparent 35%),
        linear-gradient(135deg,#03060d,#07111d 48%,#040811);
}

/* Electronics atmosphere */
body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    opacity:.32;
    background-image:
        linear-gradient(rgba(69,231,255,.055) 1px,transparent 1px),
        linear-gradient(90deg,rgba(69,231,255,.055) 1px,transparent 1px);
    background-size:38px 38px;
    mask-image:linear-gradient(to bottom,black,transparent 88%);
}

body:after{
    content:"";
    position:fixed;
    width:520px;
    height:520px;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    z-index:-1;
    border-radius:50%;
    background:rgba(45,185,255,.045);
    box-shadow:0 0 140px rgba(69,231,255,.07);
    pointer-events:none;
}

.page{
    width:min(1120px,calc(100% - 28px));
    margin:0 auto;
    padding:22px 0 40px;
}

/* Header */
.header{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    padding:19px 21px;
    border:1px solid var(--line);
    border-radius:20px;
    background:linear-gradient(145deg,rgba(16,31,48,.88),rgba(5,13,23,.84));
    backdrop-filter:blur(22px);
    box-shadow:
        0 18px 55px rgba(0,0,0,.42),
        inset 1px 1px 0 rgba(255,255,255,.055),
        inset -1px -1px 0 rgba(0,0,0,.5);
    overflow:hidden;
}

.header:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:42%;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    box-shadow:0 0 16px var(--cyan);
    animation:scan 4s ease-in-out infinite;
}

.header:after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-95px;
    top:-100px;
    border-radius:50%;
    border:1px solid rgba(69,231,255,.10);
    box-shadow:0 0 0 18px rgba(69,231,255,.025),0 0 0 36px rgba(69,231,255,.015);
}

.title{
    font-size:20px;
    font-weight:950;
    letter-spacing:.2px;
    text-shadow:0 0 18px rgba(69,231,255,.16);
}

.details{
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.25px;
}

.timer{
    position:relative;
    min-width:125px;
    padding:12px 17px;
    border:1px solid rgba(69,231,255,.24);
    border-radius:14px;
    text-align:center;
    color:#c8faff;
    background:linear-gradient(145deg,rgba(69,231,255,.11),rgba(39,141,255,.06));
    box-shadow:
        0 0 20px rgba(69,231,255,.09),
        inset 1px 1px 0 rgba(255,255,255,.06);
    font-size:22px;
    font-weight:950;
    letter-spacing:1px;
    text-shadow:0 0 13px rgba(69,231,255,.7);
}

.timer:before{
    content:"TIME";
    display:block;
    margin-bottom:2px;
    color:#7395a7;
    font-size:8px;
    letter-spacing:2px;
    font-weight:900;
}

.timer.danger{
    color:#fff;
    border-color:rgba(255,88,116,.65);
    background:linear-gradient(145deg,rgba(255,88,116,.22),rgba(80,16,35,.7));
    box-shadow:0 0 25px rgba(255,88,116,.25),inset 0 0 18px rgba(255,88,116,.08);
    animation:dangerPulse .8s infinite;
}

/* Progress */
.progress{
    margin:17px 0;
    padding:15px 18px;
    border:1px solid var(--line);
    border-radius:17px;
    background:rgba(8,18,30,.74);
    backdrop-filter:blur(16px);
    box-shadow:0 12px 35px rgba(0,0,0,.25),inset 1px 1px 0 rgba(255,255,255,.035);
}

.progress-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
    color:#90a8b8;
    font-size:10px;
    font-weight:850;
    letter-spacing:.5px;
}

.bar{
    height:8px;
    overflow:hidden;
    border-radius:999px;
    background:rgba(255,255,255,.055);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.45);
}

.fill{
    position:relative;
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet));
    box-shadow:0 0 14px rgba(69,231,255,.5);
    transition:width .35s cubic-bezier(.2,.8,.2,1);
}

.fill:after{
    content:"";
    position:absolute;
    right:0;
    top:0;
    width:55px;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75));
    filter:blur(3px);
}

/* Question card */
.card{
    position:relative;
    padding:34px 36px 27px;
    border:1px solid rgba(105,225,255,.15);
    border-radius:25px;
    background:
        linear-gradient(145deg,rgba(14,29,45,.93),rgba(5,13,23,.91));
    box-shadow:
        0 35px 85px rgba(0,0,0,.45),
        0 0 45px rgba(39,141,255,.055),
        inset 1px 1px 0 rgba(255,255,255,.055),
        inset -1px -1px 0 rgba(0,0,0,.65);
    overflow:hidden;
}

.card:before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    right:-150px;
    top:-150px;
    border-radius:50%;
    background:rgba(69,231,255,.05);
    box-shadow:0 0 90px rgba(69,231,255,.08);
}

.card:after{
    content:"";
    position:absolute;
    left:25px;
    top:0;
    width:90px;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    box-shadow:0 0 12px var(--cyan);
}

.top{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.number{
    padding:8px 13px;
    border:1px solid rgba(69,231,255,.19);
    border-radius:10px;
    color:#8ceeff;
    background:rgba(69,231,255,.055);
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.035);
    font-size:10px;
    font-weight:950;
    letter-spacing:1px;
}

.question{
    position:relative;
    margin-bottom:28px;
    max-width:950px;
    font-size:24px;
    line-height:1.55;
    font-weight:800;
    letter-spacing:.1px;
    text-shadow:0 2px 15px rgba(0,0,0,.25);
}

.question-image{
    display:none;
    max-width:100%;
    max-height:420px;
    margin:0 auto 25px;
    border-radius:14px;
    object-fit:contain;
}

.question:before{
    content:"";
    display:block;
    width:34px;
    height:3px;
    margin-bottom:15px;
    border-radius:4px;
    background:linear-gradient(90deg,var(--cyan),transparent);
    box-shadow:0 0 10px rgba(69,231,255,.6);
}

/* Options */
.options{
    display:grid;
    gap:13px;
}

.option{
    position:relative;
    transform:translateZ(0);
}

.option input{
    position:absolute;
    opacity:0;
}

.option label{
    position:relative;
    display:flex;
    align-items:center;
    min-height:64px;
    padding:14px 17px;
    border:1px solid rgba(135,183,207,.13);
    border-radius:15px;
    color:#c9d8e1;
    background:
        linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    cursor:pointer;
    transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease;
    box-shadow:
        0 7px 18px rgba(0,0,0,.20),
        inset 1px 1px 0 rgba(255,255,255,.035);
}

.option label:hover{
    transform:translateY(-3px) translateX(2px);
    border-color:rgba(69,231,255,.43);
    color:#f4fdff;
    background:linear-gradient(145deg,rgba(69,231,255,.09),rgba(39,141,255,.035));
    box-shadow:
        0 13px 28px rgba(0,0,0,.30),
        0 0 22px rgba(69,231,255,.08);
}

.option input:checked + label{
    transform:translateY(-2px);
    border-color:rgba(69,231,255,.78);
    color:#fff;
    background:
        linear-gradient(145deg,rgba(69,231,255,.15),rgba(39,141,255,.07));
    box-shadow:
        0 0 0 1px rgba(69,231,255,.14),
        0 12px 30px rgba(0,0,0,.3),
        0 0 27px rgba(69,231,255,.14),
        inset 0 0 25px rgba(69,231,255,.035);
}

.option input:checked + label:after{
    content:"✓";
    position:absolute;
    right:17px;
    width:24px;
    height:24px;
    display:grid;
    place-items:center;
    border-radius:50%;
    color:#031017;
    background:var(--cyan);
    box-shadow:0 0 15px rgba(69,231,255,.7);
    font-weight:950;
}

.letter{
    flex:0 0 auto;
    display:inline-flex;
    width:34px;
    height:34px;
    align-items:center;
    justify-content:center;
    margin-right:13px;
    border:1px solid rgba(69,231,255,.16);
    border-radius:10px;
    color:#7feeff;
    background:linear-gradient(145deg,rgba(69,231,255,.09),rgba(39,141,255,.035));
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.05);
    font-size:11px;
    font-weight:950;
}

.option input:checked + label .letter{
    color:#031017;
    border-color:transparent;
    background:var(--cyan);
    box-shadow:0 0 14px rgba(69,231,255,.55);
}

/* Navigation */
.nav{
    display:flex;
    justify-content:flex-end;
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid rgba(255,255,255,.07);
}

button{
    position:relative;
    min-width:145px;
    height:49px;
    padding:0 23px;
    border:1px solid rgba(104,226,255,.28);
    border-radius:13px;
    color:#031017;
    background:linear-gradient(135deg,#65efff,#258dff);
    cursor:pointer;
    font-size:11px;
    font-weight:950;
    letter-spacing:.6px;
    box-shadow:
        0 10px 25px rgba(0,0,0,.3),
        0 0 22px rgba(69,231,255,.15),
        inset 1px 1px 0 rgba(255,255,255,.5),
        inset -2px -3px 5px rgba(0,70,120,.2);
    transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
    overflow:hidden;
}

button:before{
    content:"";
    position:absolute;
    top:-80%;
    left:-70%;
    width:45%;
    height:260%;
    transform:rotate(24deg);
    background:rgba(255,255,255,.45);
    filter:blur(8px);
    transition:left .5s ease;
}

button:hover{
    transform:translateY(-3px);
    filter:brightness(1.08);
    box-shadow:0 15px 32px rgba(0,0,0,.38),0 0 30px rgba(69,231,255,.28);
}

button:hover:before{left:135%}

button:active{transform:translateY(1px)}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.submit{
    color:white;
    border-color:rgba(50,230,162,.35);
    background:linear-gradient(135deg,#16b981,#32e6a2);
    box-shadow:0 10px 27px rgba(0,0,0,.3),0 0 24px rgba(50,230,162,.16);
}

/* Completion */
.completion-screen{
    position:fixed;
    inset:0;
    z-index:300000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
    background:
        radial-gradient(circle at 20% 20%,rgba(69,231,255,.13),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(50,230,162,.10),transparent 30%),
        rgba(2,7,13,.94);
    backdrop-filter:blur(14px);
}

.completion-screen.active{display:flex}

.completion-card{
    width:100%;
    max-width:560px;
    padding:49px 43px;
    border:1px solid rgba(69,231,255,.20);
    border-radius:30px;
    background:linear-gradient(145deg,rgba(13,29,44,.96),rgba(5,13,22,.97));
    box-shadow:
        0 45px 120px rgba(0,0,0,.62),
        0 0 60px rgba(69,231,255,.08),
        inset 1px 1px 0 rgba(255,255,255,.06);
}

.success-icon{
    width:92px;
    height:92px;
    margin:0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(50,230,162,.35);
    border-radius:50%;
    color:#04140f;
    background:linear-gradient(145deg,#76ffd0,#32e6a2);
    box-shadow:0 0 35px rgba(50,230,162,.28),inset 2px 2px 5px rgba(255,255,255,.5);
    font-size:43px;
    font-weight:950;
    animation:successPop .7s cubic-bezier(.2,1.4,.4,1);
}

.completion-badge{
    display:inline-block;
    padding:8px 14px;
    margin-bottom:15px;
    border:1px solid rgba(50,230,162,.18);
    border-radius:999px;
    color:#75f2c5;
    background:rgba(50,230,162,.07);
    font-size:10px;
    font-weight:950;
    letter-spacing:1px;
}

.completion-card h1{
    font-size:35px;
    font-weight:950;
    text-shadow:0 0 25px rgba(69,231,255,.12);
}

.completion-message{
    margin-top:12px;
    color:#e8faff;
    font-size:17px;
    font-weight:750;
}

.completion-sub{
    max-width:390px;
    margin:10px auto 0;
    color:#8297a8;
    font-size:13px;
    line-height:1.7;
}

.completion-line{
    width:100%;
    height:1px;
    margin:28px 0;
    background:linear-gradient(90deg,transparent,rgba(69,231,255,.2),transparent);
}

.completion-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:24px;
}

.completion-info div{
    padding:15px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    background:rgba(255,255,255,.025);
}

.completion-info span{
    display:block;
    margin-bottom:5px;
    color:#6e8798;
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
}

.completion-info strong{font-size:13px}

.dashboard-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:52px;
    border:1px solid rgba(69,231,255,.25);
    border-radius:13px;
    color:#031017;
    background:linear-gradient(135deg,#65efff,#258dff);
    text-decoration:none;
    font-size:12px;
    font-weight:950;
    box-shadow:0 0 25px rgba(69,231,255,.12);
}

/* Motion */
@keyframes scan{
    0%,100%{transform:translateX(-20%);opacity:.35}
    50%{transform:translateX(130%);opacity:1}
}
@keyframes dangerPulse{
    50%{transform:scale(1.035);box-shadow:0 0 34px rgba(255,88,116,.38)}
}
@keyframes successPop{
    0%{transform:scale(.45);opacity:0}
    100%{transform:scale(1);opacity:1}
}

/* Mobile */
@media(max-width:700px){
    .page{
        width:calc(100% - 18px);
        max-width:100%;
        padding:10px 0 25px;
    }

    .header{
        padding:15px;
        gap:12px;
        flex-direction:column;
        align-items:stretch;
    }

    .title{
        font-size:18px;
        line-height:1.3;
    }

    .details{
        font-size:10px;
        line-height:1.45;
    }

    .timer{
        width:100%;
        min-width:0;
        padding:10px 14px;
        font-size:20px;
    }

    .progress{
        padding:12px 13px;
        margin:12px 0;
    }

    .progress-info{
        font-size:9px;
        margin-bottom:8px;
    }

    .bar{
        height:7px;
    }

    .card{
        width:100%;
        padding:23px 14px 18px;
        border-radius:19px;
    }

    .top{
        margin-bottom:18px;
    }

    .number{
        padding:7px 10px;
        font-size:9px;
    }

    .question{
        width:100%;
        margin-bottom:21px;
        font-size:18px;
        line-height:1.5;
        overflow-wrap:anywhere;
    }

    .question:before{
        width:30px;
        height:2px;
        margin-bottom:11px;
    }

    .options{
        gap:10px;
    }

    .option label{
        min-height:57px;
        padding:11px 12px;
        border-radius:13px;
        font-size:13px;
        line-height:1.4;
    }

    /* Keep the same hover effect on mobile-sized layouts.
       Only the dimensions are reduced; the interaction is not removed. */
    .option label:hover{
        transform:translateY(-3px) translateX(2px);
        border-color:rgba(69,231,255,.43);
        color:#f4fdff;
        background:linear-gradient(145deg,rgba(69,231,255,.09),rgba(39,141,255,.035));
        box-shadow:
            0 10px 22px rgba(0,0,0,.28),
            0 0 18px rgba(69,231,255,.08);
    }

    .letter{
        width:30px;
        height:30px;
        min-width:30px;
        margin-right:9px;
        border-radius:8px;
        font-size:10px;
    }

    .option input:checked + label:after{
        right:11px;
        width:21px;
        height:21px;
        font-size:11px;
    }

    .nav{
        margin-top:20px;
        padding-top:17px;
    }

    button{
        width:100%;
        min-width:0;
        height:47px;
        font-size:11px;
    }

    .completion-card{
        width:calc(100% - 20px);
        max-width:520px;
        padding:36px 20px;
        border-radius:23px;
    }

    .completion-card h1{
        font-size:28px;
        line-height:1.2;
    }

    .completion-message{
        font-size:14px;
    }

    .completion-sub{
        font-size:11px;
        line-height:1.6;
    }

    .completion-info{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }
}

@media(max-width:380px){
    .page{
        width:calc(100% - 12px);
        padding:7px 0 18px;
    }

    .header{
        padding:12px;
    }

    .title{
        font-size:16px;
    }

    .details{
        font-size:9px;
    }

    .timer{
        font-size:18px;
        padding:9px 12px;
    }

    .progress{
        padding:10px 11px;
    }

    .card{
        padding:19px 11px 15px;
    }

    .question{
        font-size:16px;
        line-height:1.48;
    }

    .option label{
        min-height:53px;
        padding:9px 10px;
        font-size:12px;
    }

    .letter{
        width:28px;
        height:28px;
        min-width:28px;
        margin-right:8px;
    }

    .option input:checked + label:after{
        right:9px;
        width:19px;
        height:19px;
    }

    .completion-card{
        width:calc(100% - 12px);
        padding:29px 15px;
    }

    .completion-card h1{
        font-size:24px;
    }

    .completion-info{
        grid-template-columns:1fr;
    }
}
</style>


</head>


<body>


<!-- =====================================================
     QUIZ
===================================================== -->

<div class="page">


    <header class="header">


        <div>


            <div
                class="title"
                id="quizTitle">

                Loading...

            </div>


            <div
                class="details"
                id="studentDetails">

                Loading student...

            </div>


        </div>


        <div
            class="timer"
            id="timer">

            00:00

        </div>


    </header>


    <div class="progress">


        <div class="progress-info">


            <span id="progressText">
                Question
            </span>


            <span id="answeredText">
                0 answered
            </span>


        </div>


        <div class="bar">


            <div
                class="fill"
                id="progressFill">
            </div>


        </div>


    </div>


    <section class="card">


        <div class="top">


            <span
                class="number"
                id="questionNumber">

                QUESTION

            </span>


        </div>


        <div
            class="question"
            id="questionText">
        </div>

        <img
            class="question-image"
            id="questionImage"
            alt="Question image">

        <div
            class="options"
            id="options">
        </div>


        <div class="nav">


            <!--
                NO PREVIOUS BUTTON.
                Student can only move forward.
            -->

            <button
                class="next"
                id="next">

                Next →

            </button>


        </div>


    </section>

</div>


<!-- =====================================================
     COMPLETION
===================================================== -->

<div
    class="completion-screen"
    id="completionScreen">


    <div class="completion-card">


        <div class="success-icon">
            ✓
        </div>


        <div class="completion-badge">
            SUBMISSION SUCCESSFUL
        </div>


        <h1>
            Quiz Completed!
        </h1>


        <p
            class="completion-message"
            id="completionMessage">

            Thank you for participating.

        </p>


        <p
            class="completion-sub"
            id="completionSub">

            Your answers have been submitted successfully.
            Your response has been securely saved.

        </p>


        <div class="completion-line">
        </div>


        <div class="completion-info">


            <div>

                <span>
                    Status
                </span>

                <strong>
                    Completed
                </strong>

            </div>


            <div>

                <span>
                    Submission
                </span>

                <strong>
                    Saved
                </strong>

            </div>


        </div>


        <a
            href="/student/dashboard"
            class="dashboard-btn">

            BACK TO DASHBOARD

        </a>


    </div>

</div>


<script>


/* =====================================================
   QUIZ ID
===================================================== */

const quizId =
    "{{ quiz_id }}";


/* =====================================================
   VARIABLES
===================================================== */

let quiz = null;

let questions = [];

let current = 0;

let answers = {};

let timer = null;

let remaining = 0;

let started = false;

let submitting = false;

let tabSwitchSubmitted = false;
let quizFinished = false;
let pageIsBeingReloaded = false;
let tabSwitchTimer = null;

// Total quiz duration tracking.
// This is the only time value saved to the database.
let quizStartTime = null;
let totalTimeTaken = 0;


/* =====================================================
   SHORTCUT
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   API
===================================================== */

async function api(
    url,
    options = {}
) {


    const response =
        await fetch(
            url,
            options
        );


    let data;


    try {

        data =
            await response.json();

    }
    catch {

        throw new Error(
            "Invalid server response."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            "Request failed."
        );

    }


    return data;

}


/* =====================================================
   SHUFFLE QUESTIONS ONLY
===================================================== */

function shuffleQuestions(array) {


    /*
        Fisher-Yates shuffle.

        Only the question array is shuffled.

        Each question object keeps its own:
            id
            question_text
            option_a
            option_b
            option_c
            option_d
            correct_answer
            question_order
            time_limit

        Therefore scoring remains correct.

        Options remain A, B, C, D.
    */


    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {


        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =====================================================
   LOAD QUIZ
===================================================== */

async function init() {


    try {


        /*
            Get logged-in student.
        */

        const studentData =
            await api(
                "/api/student/me"
            );


        const student =
            studentData.student;


        $("studentDetails")
            .textContent =
            `${student.roll_no} • ${student.name} • Section ${student.section} • Year ${student.year}`;


        /*
            Get quiz.
        */

        const data =
            await api(
                "/api/student/quiz/"
                + quizId
            );


        quiz =
            data.quiz;


        questions =
            data.questions || [];


        /*
            =================================================
            IMPORTANT
            =================================================

            Shuffle QUESTIONS only.

            Options are NOT shuffled.
        */

        shuffleQuestions(
            questions
        );


        $("quizTitle")
            .textContent =
            quiz.title;


        if (
            !questions.length
        ) {


            alert(
                "This quiz has no questions."
            );


            location.href =
                "/student/dashboard";


            return;

        }


        // Quiz starts automatically after the questions are loaded.
        started = true;
        submitting = false;
        quizStartTime = Date.now();
        totalTimeTaken = 0;

        // ONE TOTAL QUIZ TIMER: 15 minutes for the complete quiz.
        startTotalTimer(15 * 60);

        showQuestion();


    }
    catch (error) {


        console.error(
            "QUIZ INIT ERROR:",
            error
        );


        alert(
            error.message
        );


        location.href =
            "/student/dashboard";

    }

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {


    const question =
        questions[current];


    if (!question) {

        return;

    }


    /*
        Question number.
    */

    $("questionNumber")
        .textContent =
        `QUESTION ${current + 1}`;


    /*
        Progress.
    */

    $("progressText")
        .textContent =
        `Question ${current + 1} of ${questions.length}`;


    updateAnswered();


    $("progressFill")
        .style.width =
        (
            (
                current + 1
            )
            /
            questions.length
            *
            100
        )
        + "%";


    /*
        Question text.
    */

    $("questionText")
        .textContent =
        question.question_text;

    const questionImage =
        $("questionImage");

    if (question.image_url) {
        questionImage.src = question.image_url;
        questionImage.style.display = "block";
    } else {
        questionImage.removeAttribute("src");
        questionImage.style.display = "none";
    }


    /*
        =================================================
        OPTIONS ARE NOT SHUFFLED
        =================================================

        Always:

        A → option_a
        B → option_b
        C → option_c
        D → option_d
    */

    const options = [

        [
            "A",
            question.option_a
        ],

        [
            "B",
            question.option_b
        ],

        [
            "C",
            question.option_c
        ],

        [
            "D",
            question.option_d
        ]

    ];


    $("options").innerHTML =

        options
            .map(
                (
                    [
                        letter,
                        text
                    ]
                ) => `

                    <div class="option">


                        <input

                            type="radio"

                            name="answer"

                            id="answer-${letter}"

                            value="${letter}"

                            ${
                                answers[
                                    question.id
                                ] === letter
                                    ? "checked"
                                    : ""
                            }

                        >


                        <label
                            for="answer-${letter}"
                        >


                            <span
                                class="letter"
                            >

                                ${letter}

                            </span>


                            ${escapeHTML(text)}


                        </label>


                    </div>

                `
            )
            .join("");


    /*
        Save selected answer.
    */

    document
        .querySelectorAll(
            'input[name="answer"]'
        )
        .forEach(
            input => {


                input.addEventListener(
                    "change",
                    () => {


                        answers[
                            question.id
                        ] =
                            input.value;


                        updateAnswered();

                    }
                );

            }
        );


    /*
        Last question:
        Submit button.

        Other questions:
        Next button.
    */

    if (
        current ===
        questions.length - 1
    ) {


        $("next")
            .textContent =
            "SUBMIT QUIZ ✓";


        $("next")
            .className =
            "submit";

    }
    else {


        $("next")
            .textContent =
            "Next →";


        $("next")
            .className =
            "next";

    }




}


/* =====================================================
   ANSWER COUNT
===================================================== */

function updateAnswered() {


    $("answeredText")
        .textContent =
        `${Object.keys(answers).length} answered`;

}


/* =====================================================
   TOTAL QUIZ TIMER
   ===================================================== */

const TOTAL_QUIZ_SECONDS = 15 * 60;

function startTotalTimer(seconds) {

    clearInterval(timer);

    remaining = Math.max(0, Number(seconds) || TOTAL_QUIZ_SECONDS);

    updateTimer();

    timer = setInterval(() => {

        remaining--;

        updateTimer();

        if (remaining <= 0) {

            clearInterval(timer);
            remaining = 0;
            updateTimer();

            // Time is over: submit whatever has been answered.
            submitQuiz(true);
        }

    }, 1000);
}


/* =====================================================
   UPDATE TOTAL TIMER
   ===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(remaining / 60);

    const seconds =
        remaining % 60;

    const text =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

    $("timer").textContent = text;

    // Warning styling for the final minute.
    $("timer").classList.toggle(
        "danger",
        remaining <= 60
    );

}


/* =====================================================
   NEXT
===================================================== */

function moveNext() {


    /*
        Answer is NOT mandatory.

        Student can click Next
        without selecting anything.
    */

    if (
        current <
        questions.length - 1
    ) {


        current++;


        showQuestion();

    }
    else {


        submitQuiz();

    }

}


/* =====================================================
   NEXT / SUBMIT BUTTON
===================================================== */

$("next")
    .addEventListener(
        "click",
        () => {


            if (
                submitting
            ) {

                return;

            }


            if (
                current <
                questions.length - 1
            ) {


                moveNext();

            }
            else {


                submitQuiz();

            }

        }
    );


/* =====================================================
   SUBMIT QUIZ
===================================================== */


/* =====================================================
   TAB SWITCH ONLY
   Refresh / F5 must NOT submit.
   Another browser tab staying hidden DOES submit.
   ===================================================== */

/*
 * Refresh/reload/navigation fires beforeunload.
 * A normal tab switch does not.
 */
window.addEventListener(
    "beforeunload",
    function () {

        pageIsBeingReloaded = true;

        clearTimeout(
            tabSwitchTimer
        );

        tabSwitchTimer = null;

    }
);


function handleTabSwitch() {

    if (
        !started ||
        submitting ||
        tabSwitchSubmitted ||
        quizFinished ||
        pageIsBeingReloaded
    ) {
        return;
    }


    tabSwitchSubmitted = true;


    /*
     * Warning first.
     * Then submit automatically.
     */
    alert(
        "Warning: You switched to another tab. Your quiz will be submitted automatically."
    );


    submitQuiz(
        true
    );

}


/*
 * visibilitychange detects an actual browser-tab switch.
 */
document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState !== "hidden"
        ) {

            clearTimeout(
                tabSwitchTimer
            );

            tabSwitchTimer = null;

            return;

        }


        if (
            !started ||
            submitting ||
            tabSwitchSubmitted ||
            quizFinished
        ) {

            return;

        }


        clearTimeout(
            tabSwitchTimer
        );


        /*
         * Give refresh/F5 time to fire beforeunload.
         * If beforeunload fires, pageIsBeingReloaded becomes true
         * and this callback will not submit.
         */
        tabSwitchTimer =
            setTimeout(
                function () {

                    if (
                        document.visibilityState === "hidden" &&
                        !pageIsBeingReloaded &&
                        started &&
                        !submitting &&
                        !tabSwitchSubmitted &&
                        !quizFinished
                    ) {

                        handleTabSwitch();

                    }

                },
                500
            );

    }
);


async function submitQuiz(autoSubmitted = false) {


    if (
        submitting
    ) {

        return;

    }


    submitting =
        true;


    clearInterval(
        timer
    );


    $("next").disabled =
        true;


    $("next")
        .textContent =
        "SUBMITTING...";


    /*
        Calculate total quiz time in seconds.

        From the moment the quiz starts
        until submit is triggered.

        This includes time spent on all questions.
    */

    if (quizStartTime !== null) {

        totalTimeTaken =
            Math.min(
                TOTAL_QUIZ_SECONDS,
                Math.max(
                    0,
                    Math.floor(
                        (Date.now() - quizStartTime) / 1000
                    )
                )
            );

    }


    try {


        /*
            Send answers + TOTAL quiz time.
        

            Unanswered questions are not included.
        */

        await api(
            "/api/student/submit",
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        quiz_id:
                            quiz.id,

                        answers:
                            answers,

                        /*
                            Total quiz duration in seconds.
                        */
                        total_time_taken:
                            totalTimeTaken

                    }),

                keepalive:
                    true

            }
        );


        /*
            IMPORTANT:

            Set started=false BEFORE our own
            exitFullscreen() call.

            Therefore fullscreenchange will
            NOT trigger a second submission.
        */

        started =
            false;

        quizFinished =
            true;


        /*
            Show completion screen.
        */

        $("completionScreen")
            .classList
            .add(
                "active"
            );


        document.body.style.overflow =
            "hidden";


    }
    catch (
        error
    ) {


        console.error(
            "SUBMIT ERROR:",
            error
        );


        submitting =
            false;


        $("next").disabled =
            false;


        $("next")
            .textContent =

            current ===
            questions.length - 1

                ? "SUBMIT QUIZ ✓"

                : "Next →";


        alert(
            error.message
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =====================================================
   INITIALIZE
===================================================== */

init();


</script>


</body>

</html>
