
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineers Day Quiz | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-dark: #0f172a;
            --primary-darker: #030712;
            --accent-purple: #a855f7;
            --accent-orange: #f59e0b;
            --accent-cyan: #06b6d4;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --bg-panel: rgba(15, 23, 42, 0.8);
            --border-color: rgba(168, 85, 247, 0.2);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        html {
            min-height: 100%;
            background: var(--primary-darker);
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            color: var(--text-primary);
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e1b4b 50%,
                #0f172a 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated gradient orbs */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.12), transparent 50%),
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* Subtle grid pattern */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow:
                0 25px 80px rgba(168, 85, 247, 0.1),
                0 0 1px 1px rgba(255, 255, 255, 0.08) inset;
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-wrapper {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            color: white;
            box-shadow:
                0 15px 40px rgba(168, 85, 247, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
            letter-spacing: -2px;
        }

        .card:hover .logo {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 12px;
        }

        .organized-by {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #a855f7 0%, #f59e0b 100%);
            margin: 20px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        /* Form section */
        .form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
        }

        input,
        select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            font-family: inherit;
            font-weight: 500;
            transition: all 0.2s ease;
            outline: none;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:hover,
        select:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.04);
        }

        input:focus,
        select:focus {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.05);
            box-shadow:
                0 0 0 3px rgba(168, 85, 247, 0.1),
                0 0 0 1px rgba(168, 85, 247, 0.3);
        }

        select {
            cursor: pointer;
            padding-right: 12px;
        }

        select option {
            background: var(--primary-dark);
            color: var(--text-primary);
        }

        /* Submit button */
        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            color: white;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 30px rgba(168, 85, 247, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow:
                0 15px 40px rgba(168, 85, 247, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .btn:hover:not(:disabled)::before {
            transform: translateX(100%);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Messages */
        .message {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message.show {
            display: block;
        }

        /* Footer link */
        .footer-link {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .footer-link a:hover {
            color: var(--accent-orange);
        }

        /* Tablet & Large Phones */
        @media (max-width: 768px) {
            .container {
                max-width: 95%;
            }

            .card {
                padding: 40px 28px;
                border-radius: 18px;
            }

            h1 {
                font-size: 32px;
            }

            .logo {
                width: 75px;
                height: 75px;
                font-size: 30px;
            }

            input,
            select {
                padding: 14px 16px;
                font-size: 16px;
                height: 48px;
            }

            .btn {
                padding: 14px;
                font-size: 12px;
                height: 48px;
            }
        }

        /* Medium Phones */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
                align-items: center;
                min-height: 100vh;
            }

            .container {
                width: 100%;
                max-width: none;
            }

            .card {
                padding: 32px 24px;
                border-radius: 16px;
                width: 100%;
            }

            .header {
                margin-bottom: 28px;
            }

            .logo-wrapper {
                margin-bottom: 16px;
            }

            .logo {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }

            h1 {
                font-size: 28px;
                letter-spacing: 0;
            }

            .tagline {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .organized-by {
                font-size: 10px;
            }

            .divider {
                width: 50px;
                height: 2px;
                margin: 16px auto 0;
            }

            .form {
                margin-top: 24px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                font-size: 10px;
                letter-spacing: 0.8px;
                margin-bottom: 8px;
            }

            input,
            select {
                padding: 13px 14px;
                font-size: 16px;
                height: 46px;
                border-radius: 10px;
            }

            .btn {
                padding: 13px;
                font-size: 12px;
                height: 46px;
                margin-top: 6px;
            }

            .footer-link {
                margin-top: 24px;
                font-size: 11px;
            }
        }

        /* Small Phones */
        @media (max-width: 480px) {
            body {
                padding: 20px 10px;
                align-items: center;
            }

            .card {
                padding: 26px 18px;
                border-radius: 14px;
            }

            .header {
                margin-bottom: 24px;
            }

            .logo-wrapper {
                margin-bottom: 14px;
            }

            .logo {
                width: 64px;
                height: 64px;
                font-size: 26px;
                border-radius: 12px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 6px;
            }

            .tagline {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .organized-by {
                font-size: 9px;
            }

            .divider {
                width: 45px;
                height: 2px;
                margin: 14px auto 0;
            }

            .form {
                margin-top: 20px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            label {
                font-size: 9px;
                letter-spacing: 0.6px;
                margin-bottom: 7px;
            }

            input,
            select {
                padding: 12px 13px;
                font-size: 16px;
                height: 44px;
                border-radius: 9px;
            }

            input::placeholder {
                font-size: 14px;
            }

            .btn {
                padding: 12px;
                font-size: 11px;
                height: 44px;
                letter-spacing: 0.8px;
                margin-top: 4px;
            }

            .footer-link {
                margin-top: 20px;
                font-size: 10px;
                line-height: 1.6;
            }

            .footer-link a {
                display: inline;
            }
        }

        /* Extra Small Phones */
        @media (max-width: 380px) {
            body {
                padding: 18px 8px;
                align-items: center;
            }

            .card {
                padding: 22px 16px;
                border-radius: 12px;
            }

            .header {
                margin-bottom: 20px;
            }

            .logo {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            h1 {
                font-size: 22px;
            }

            .form {
                margin-top: 18px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            input,
            select {
                height: 42px;
            }

            .btn {
                height: 42px;
                font-size: 10px;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e1b4b 50%,
                    #0f172a 100%
                );
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <!-- Header -->
            <div class="header">
                <div class="logo-wrapper">
                    <div class="logo">ECE</div>
                </div>
                <h1>Welcome Back</h1>
                <div class="divider"></div>
                <p class="tagline">Login with your roll number</p>
                <p class="organized-by">Organized by Electronics & Communication Engineering</p>
            </div>

            <!-- Form -->
            <form class="form" id="loginForm">
                <!-- Roll Number -->
                <div class="form-group">
                    <label for="rollNo">Roll Number</label>
                    <input
                        type="text"
                        id="rollNo"
                        placeholder="Example: 24A31A04O1"
                        autocomplete="off"
                        maxlength="30"
                        required
                    >
                </div>

                <!-- Submit Button -->
                <button type="button" class="btn" id="loginBtn">Sign In</button>

                <!-- Error Message -->
                <div class="message error-message" id="errorMessage"></div>
            </form>

            <!-- Footer Link -->
            <div class="footer-link">
                New student? <a href="/student/register">Create your profile</a>
            </div>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const form = document.getElementById('loginForm');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        loginBtn.addEventListener('click', async function (e) {
            e.preventDefault();
            hideError();

            // Get form values
            const rollNo = document.getElementById('rollNo').value.trim().toUpperCase();

            // Validation
            if (!rollNo) {
                showError('Please enter your roll number.');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = 'SIGNING IN...';

            try {
                const response = await fetch('/api/student/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        roll_no: rollNo
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed.');
                }

                loginBtn.textContent = '✓ SUCCESS';
                
                setTimeout(() => {
                    window.location.href = '/student/dashboard';
                }, 800);

            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Something went wrong. Please try again.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Enter key support
        form.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                loginBtn.click();
            }
        });

        // Auto format roll number
        document.getElementById('rollNo').addEventListener('input', function () {
            this.value = this.value.toUpperCase().replace(/\s+/g, '');
        });
    </script>
</body>

</html>
