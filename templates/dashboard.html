<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineers Day Quiz | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-dark: #0f172a;
            --primary-darker: #030712;
            --accent-purple: #a855f7;
            --accent-orange: #f59e0b;
            --accent-cyan: #06b6d4;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --bg-panel: rgba(15, 23, 42, 0.8);
            --border-color: rgba(168, 85, 247, 0.2);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        html {
            min-height: 100%;
            background: var(--primary-darker);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            color: var(--text-primary);
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e1b4b 50%,
                #0f172a 100%
            );
            overflow-x: hidden;
        }

        /* Animated gradient orbs */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.12), transparent 50%),
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Subtle grid pattern */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
            padding: 18px 0;
            margin-bottom: 30px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: white;
            box-shadow:
                0 10px 30px rgba(168, 85, 247, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
            letter-spacing: -2px;
        }

        .logo:hover {
            transform: translateY(-3px);
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .logout-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.4);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* Profile card */
        .profile-card {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 35px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 30px;
            align-items: center;
        }

        .profile-info h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-info p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(168, 85, 247, 0.05);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            margin-bottom: 6px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 14px 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            border-bottom: 2px solid transparent;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent-purple);
            border-bottom-color: var(--accent-purple);
        }

        /* Section */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #f59e0b);
        }

        /* Quiz grid */
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .quiz-card {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2),
                0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
            display: flex;
            flex-direction: column;
        }

        .quiz-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-5px);
            box-shadow:
                0 15px 40px rgba(168, 85, 247, 0.15),
                0 0 1px 1px rgba(255, 255, 255, 0.08) inset;
        }

        .quiz-card h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .quiz-card p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            flex-grow: 1;
            line-height: 1.6;
        }

        .quiz-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        .quiz-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
            position: relative;
            overflow: hidden;
        }

        .quiz-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.4);
        }

        .quiz-btn:active:not(:disabled) {
            transform: translateY(0);
        }
.leaderboard-btn:hover {
            background: rgba(168, 85, 247, 0.18);
            border-color: rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .quiz-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Empty state */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            background: rgba(168, 85, 247, 0.02);
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        /* Winners section */
        .winners-hero {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, rgba(245, 158, 11, 0.08) 100%);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.1);
        }

        .winners-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .winners-hero h3 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .winners-hero p {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 0;
        }

        /* Winners table */
        .winners-table {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            background: var(--bg-panel);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .table-header {
            display: grid;
            grid-template-columns: 60px 1fr 120px 120px;
            gap: 16px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(245, 158, 11, 0.1) 100%);
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-row {
            display: grid;
            grid-template-columns: 60px 1fr 120px 120px;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.05);
            align-items: center;
            transition: background 0.3s ease;
        }

        .table-row:hover {
            background: rgba(168, 85, 247, 0.05);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .rank {
            font-weight: 900;
            font-size: 16px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .student-name {
            font-weight: 700;
            color: var(--text-primary);
        }

        .student-roll {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .score {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            color: #86efac;
            text-align: center;
            font-size: 12px;
        }

        .time {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-wrap: wrap;
                justify-content: space-between;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .profile-card {
                grid-template-columns: 1fr;
                padding: 24px;
                gap: 20px;
            }

            .quiz-grid {
                grid-template-columns: 1fr;
            }

            .table-header,
            .table-row {
                grid-template-columns: 50px 1fr 100px;
                gap: 10px;
            }

            .time {
                display: none;
            }

            .quiz-card {
                min-height: auto;
            }

            .tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tab {
                padding: 12px 16px;
                white-space: nowrap;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                padding: 0 12px;
                gap: 10px;
            }

            .logo {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .brand-text h1 {
                font-size: 16px;
            }

            .brand-text p {
                font-size: 9px;
            }

            .container {
                padding: 0 12px 40px;
            }

            .profile-card {
                padding: 18px;
                margin-bottom: 25px;
            }

            .profile-info h2 {
                font-size: 22px;
            }

            .stats-grid {
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .quiz-card {
                padding: 18px;
            }

            .quiz-card h3 {
                font-size: 14px;
            }

            .logout-btn {
                padding: 8px 12px;
                font-size: 10px;
            }
        }
    
.completed-btn {
    cursor: pointer !important;
    opacity: 1 !important;
}
.completed-btn:hover {
    transform: translateY(-1px);
}

</style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="brand">
                <div class="logo">ECE</div>
                <div class="brand-text">
                    <h1>Engineers Day Quiz</h1>
                    <p>Student Portal</p>
                </div>
            </div>
            <button class="logout-btn" id="logout">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Profile Card -->
        <section class="profile-card">
            <div class="profile-info">
                <h2 id="welcome">Welcome</h2>
                <p id="studentInfo">Loading your profile...</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="quizCount">0</span>
                    <span class="stat-label">Available</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="scoreCount">0</span>
                    <span class="stat-label">Attempted</span>
                </div>
            </div>
        </section>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="quizzes">Available Quizzes</button>
            <button class="tab" data-tab="completed">Completed</button>
        </div>

        <!-- Quizzes Section -->
        <section class="section active" id="quizzes">
            <h3 class="section-title">Available Quizzes</h3>
            <div class="quiz-grid" id="quizGrid"></div>
        </section>

        <!-- Winners Section -->
        <section class="section" id="completed">
            <h3 class="section-title">Completed</h3>
            <div class="quiz-grid" id="completedGrid"></div>
        </section>
    </main>

    <script>
        let student = null;

        async function api(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Request failed.");
            return data;
        }

        async function load() {
            try {
                const me = await api("/api/student/me");
                student = me.student;

                document.getElementById("welcome").textContent = `Welcome, ${student.name}`;
                document.getElementById("studentInfo").textContent = 
                    `${student.roll_no} • Section ${student.section} • Year ${student.year}`;

                const quizData = await api("/api/student/quizzes");
                renderQuizzes(quizData.quizzes);
                renderCompleted(quizData.quizzes);

                const attempted = quizData.quizzes.filter(q => q.attempted).length;
                document.getElementById("scoreCount").textContent = attempted;

            } catch (error) {
                alert(error.message);
                location.href = "/student/login";
            }
        }

        function renderQuizzes(list) {
            // Available = ONLY running quizzes that are NOT attempted.
            // Completed quizzes must never appear here.
            const available = list.filter(
                q => q.status === "running" && !q.attempted
            );

            document.getElementById("quizCount").textContent = available.length;

            const box = document.getElementById("quizGrid");

            if (!available.length) {
                box.innerHTML = `
                    <div class="empty-state">
                        <p>No quizzes are available yet.</p>
                    </div>
                `;
                return;
            }

            box.innerHTML = available.map(q => `
                <article class="quiz-card">
                    <h3>${escapeHTML(q.title)}</h3>
                    <p>${escapeHTML(q.description || "Test your knowledge and skills in this quiz.")}</p>
                    <div class="quiz-meta">
                        <span class="badge">Available</span>
                    </div>
                    <button class="quiz-btn"
                        onclick="startQuiz('${q.id}')">
                        Start Quiz
                    </button>
                    <button class="quiz-btn completed-btn"
                        onclick="openWinners('${q.id}')"
                        style="margin-top:8px;">
                        🏆 Winners
                    </button>
                </article>
            `).join("");
        }

        function renderCompleted(list) {
            // Completed = student attempted OR admin marked quiz completed.
            const completed = list.filter(
                q => q.attempted || q.status === "completed"
            );

            const box = document.getElementById("completedGrid");
            if (!box) return;

            if (!completed.length) {
                box.innerHTML = `
                    <div class="empty-state">
                        <p>No completed quizzes yet.</p>
                    </div>
                `;
                return;
            }

            box.innerHTML = completed.map(q => `
                <article class="quiz-card">
                    <h3>${escapeHTML(q.title)}</h3>
                    <p>${escapeHTML(q.description || "Quiz completed successfully.")}</p>
                    <div class="quiz-meta">
                        <span class="badge success">✓ Completed</span>
                    </div>
                    <button class="quiz-btn completed-btn"
                        onclick="openWinners('${q.id}')">
                        🏆 Winners
                    </button>
                </article>
            `).join("");
        }

        function formatTime(seconds) {
            const total = Number(seconds || 0);
            const minutes = Math.floor(total / 60);
            const secs = total % 60;
            return `${minutes}m ${String(secs).padStart(2, "0")}s`;
        }

        function renderWinners(data, quizzes) {
            const box = document.getElementById("winnersBox");
            if (!box) return;

            if (!quizzes.length) {
                box.innerHTML = `<div class="empty-state"><p>No quizzes available.</p></div>`;
                return;
            }

            if (!data.revealed) {
                box.innerHTML = `<div class="empty-state"><p>Results will be declared soon. Check back later!</p></div>`;
                return;
            }

            const winners = data.winners || [];
            if (!winners.length) {
                box.innerHTML = `<div class="empty-state"><p>No winners declared yet.</p></div>`;
                return;
            }

            box.innerHTML = `
                <div class="winners-hero">
                    <span class="winners-icon">🏆</span>
                    <h3>Top Performers</h3>
                    <p>${escapeHTML(data.quiz?.title || 'Quiz Results')}</p>
                </div>
                <div class="winners-table">
                    <div class="table-header">
                        <div>Rank</div>
                        <div>Name</div>
                        <div>Score</div>
                        <div>Time</div>
                    </div>
                    ${winners.map(w => `
                        <div class="table-row">
                            <div class="rank">#${w.position}</div>
                            <div>
                                <div class="student-name">${escapeHTML(w.name)}</div>
                                <div class="student-roll">${escapeHTML(w.roll_no)}</div>
                            </div>
                            <div class="score">${w.score}/${w.total_questions}</div>
                            <div class="time">${formatTime(w.total_time_taken)}</div>
                        </div>
                    `).join("")}
                </div>
            `;
        }

        async function loadDashboardDeclarations(quizzes) {
            let winnersData = { revealed: false, winners: [] };
            const winnersQuiz = quizzes.find(q => q.winners_revealed);

            if (winnersQuiz) {
                try {
                    winnersData = await api("/api/student/winners/" + winnersQuiz.id);
                } catch (error) {
                    console.error("Winners load failed:", error);
                }
            }

            renderWinners(winnersData, quizzes);
        }

        async function openWinners(id) {
            try {
                const data = await api("/api/student/winners/" + id);

                const box = document.getElementById("completedGrid");
                if (!box) return;

                if (!data.revealed) {
                    box.innerHTML = `
                        <div class="empty-state">
                            <p>🏆 Winners have not been declared yet. Check back later!</p>
                        </div>
                    `;
                } else {
                    const winners = data.winners || [];

                    if (!winners.length) {
                        box.innerHTML = `
                            <div class="empty-state">
                                <p>No winners have been declared yet.</p>
                            </div>
                        `;
                    } else {
                        box.innerHTML = `
                            <div class="winners-hero" style="grid-column: 1 / -1;">
                                <span class="winners-icon">🏆</span>
                                <h3>Winners</h3>
                                <p>${escapeHTML(data.quiz?.title || "Quiz")}</p>
                            </div>

                            <div class="winners-table" style="grid-column: 1 / -1;">
                                <div class="table-header">
                                    <div>Rank</div>
                                    <div>Name</div>
                                    <div>Score</div>
                                    <div>Time</div>
                                </div>

                                ${winners.map((w, index) => `
                                    <div class="table-row">
                                        <div class="rank">#${w.position ?? index + 1}</div>
                                        <div>
                                            <div class="student-name">${escapeHTML(w.name || "Student")}</div>
                                            <div class="student-roll">${escapeHTML(w.roll_no || "")}</div>
                                        </div>
                                        <div class="score">
                                            ${w.score ?? 0}/${w.total_questions ?? 0}
                                        </div>
                                        <div class="time">
                                            ${formatTime(w.total_time_taken || 0)}
                                        </div>
                                    </div>
                                `).join("")}
                            </div>
                        `;
                    }
                }

                document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
                document.querySelectorAll(".section").forEach(x => x.classList.remove("active"));

                const completedTab = document.querySelector('[data-tab="completed"]');
                const completedSection = document.getElementById("completed");

                if (completedTab) completedTab.classList.add("active");
                if (completedSection) completedSection.classList.add("active");

                window.scrollTo({ top: 0, behavior: "smooth" });
            } catch (error) {
                alert(error.message);
            }
        }

        function startQuiz(id) {
            location.href = "/student/quiz/" + id;
        }

        // Tab switching
        document.querySelectorAll(".tab").forEach(button => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
                document.querySelectorAll(".section").forEach(x => x.classList.remove("active"));
                button.classList.add("active");
                document.getElementById(button.dataset.tab).classList.add("active");
            });
        });

        // Logout
        document.getElementById("logout").addEventListener("click", async () => {
            await fetch("/api/student/logout", { method: "POST" });
            location.href = "/student/login";
        });

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        load();
    </script>
</body>

</html>
