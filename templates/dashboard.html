<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineers Day Quiz | Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-dark: #0f172a;
            --primary-darker: #030712;
            --accent-purple: #a855f7;
            --accent-orange: #f59e0b;
            --accent-cyan: #06b6d4;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --bg-panel: rgba(15, 23, 42, 0.8);
            --border-color: rgba(168, 85, 247, 0.2);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        html {
            min-height: 100%;
            background: var(--primary-darker);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            color: var(--text-primary);
            background: linear-gradient(
                135deg,
                #0f172a 0%,
                #1e1b4b 50%,
                #0f172a 100%
            );
            overflow-x: hidden;
        }

        /* Animated gradient orbs */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(168, 85, 247, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.12), transparent 50%),
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Subtle grid pattern */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
            padding: 18px 0;
            margin-bottom: 30px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: white;
            box-shadow:
                0 10px 30px rgba(168, 85, 247, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
            letter-spacing: -2px;
        }

        .logo:hover {
            transform: translateY(-3px);
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .logout-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.4);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* Profile card */
        .profile-card {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 35px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 30px;
            align-items: center;
        }

        .profile-info h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-info p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(168, 85, 247, 0.05);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            margin-bottom: 6px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 14px 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            border-bottom: 2px solid transparent;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent-purple);
            border-bottom-color: var(--accent-purple);
        }

        /* Section */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #f59e0b);
        }

        /* Quiz grid */
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .quiz-card {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2),
                0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
            display: flex;
            flex-direction: column;
        }

        .quiz-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-5px);
            box-shadow:
                0 15px 40px rgba(168, 85, 247, 0.15),
                0 0 1px 1px rgba(255, 255, 255, 0.08) inset;
        }

        .quiz-card h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .quiz-card p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            flex-grow: 1;
            line-height: 1.6;
        }

        .quiz-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        .quiz-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7 0%, #f59e0b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
            position: relative;
            overflow: hidden;
        }

        .quiz-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.4);
        }

        .quiz-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .leaderboard-btn:hover {
            background: rgba(168, 85, 247, 0.18);
            border-color: rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .quiz-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Empty state */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            background: rgba(168, 85, 247, 0.02);
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        .completed-btn {
            cursor: pointer !important;
            opacity: 1 !important;
        }

        .completed-btn:hover {
            transform: translateY(-1px);
        }

        /* ===== WINNERS CELEBRATION - AMAZING COLORS & VIBES ===== */

        /* Hero Section - Stunning Gradient Background */
        .winners-hero {
            background: linear-gradient(
                135deg,
                #ff006e 0%,
                #fb5607 15%,
                #ffbe0b 30%,
                #8338ec 45%,
                #3a86ff 60%,
                #06ffa5 75%,
                #ff006e 100%
            );
            background-size: 300% 300%;
            animation: celebrationGradient 8s ease infinite, heroPulse 2s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 
                0 0 60px rgba(255, 0, 110, 0.6),
                0 0 100px rgba(51, 134, 255, 0.4),
                0 0 140px rgba(131, 56, 236, 0.3),
                inset 0 0 50px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Animated particles background in hero */
        .winners-hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.4), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.3), transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.35), transparent 50%);
            animation: particleFloat 4s ease-in-out infinite;
            pointer-events: none;
        }

        .winners-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 25% 75%, rgba(255, 190, 11, 0.2), transparent 40%),
                radial-gradient(circle at 75% 25%, rgba(255, 0, 110, 0.2), transparent 40%);
            animation: shimmer 3s ease-in-out infinite;
            pointer-events: none;
        }

        .winners-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
            position: relative;
            z-index: 2;
            animation: trophyBounce 1.2s cubic-bezier(0.36, 0, 0.66, -0.56) infinite;
            filter: drop-shadow(0 0 20px rgba(255, 190, 11, 0.8));
            text-shadow: 0 0 20px rgba(51, 134, 255, 0.6);
        }

        .winners-hero h3 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(
                90deg,
                #ffff00,
                #ff006e,
                #3a86ff,
                #06ffa5,
                #ffff00
            );
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShimmer 3s ease infinite;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255, 0, 110, 0.4);
        }

        .winners-hero p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 15px;
            margin: 0;
            position: relative;
            z-index: 2;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* Main Winners Table Styling */
        .winners-table {
            width: 100%;
            border: 2px solid rgba(255, 0, 110, 0.5);
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(
                135deg,
                rgba(15, 23, 42, 0.95) 0%,
                rgba(30, 27, 75, 0.95) 50%,
                rgba(15, 23, 42, 0.95) 100%
            );
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(51, 134, 255, 0.3),
                inset 0 0 40px rgba(131, 56, 236, 0.1);
            position: relative;
            animation: tableGlow 3s ease-in-out infinite;
        }

        .table-header {
            display: grid;
            grid-template-columns: 60px 1fr 120px 90px 60px;
            gap: 16px;
            padding: 20px 24px;
            background: linear-gradient(
                90deg,
                rgba(255, 0, 110, 0.25) 0%,
                rgba(51, 134, 255, 0.25) 50%,
                rgba(131, 56, 236, 0.25) 100%
            );
            border-bottom: 2px solid rgba(131, 56, 236, 0.4);
            font-weight: 900;
            font-size: 12px;
            color: #06ffa5;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(6, 255, 165, 0.5);
            animation: headerGlow 2s ease-in-out infinite;
        }

        /* Winners Table Rows - Each with unique celebration color */
        .table-row {
            display: grid;
            grid-template-columns: 60px 1fr 120px 90px 60px;
            gap: 16px;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(131, 56, 236, 0.2);
            align-items: center;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: rowDropIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity;
        }

        .table-row::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: width 0.6s ease;
            pointer-events: none;
        }

        .table-row:hover::before {
            width: 100%;
        }

        .table-row:hover {
            background: linear-gradient(
                90deg,
                rgba(131, 56, 236, 0.15),
                rgba(51, 134, 255, 0.15),
                rgba(131, 56, 236, 0.15)
            );
            transform: translateX(8px);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-row:nth-child(2) { animation-delay: 0.1s; }
        .table-row:nth-child(3) { animation-delay: 0.2s; }
        .table-row:nth-child(4) { animation-delay: 0.3s; }
        .table-row:nth-child(5) { animation-delay: 0.4s; }
        .table-row:nth-child(6) { animation-delay: 0.5s; }
        .table-row:nth-child(7) { animation-delay: 0.6s; }
        .table-row:nth-child(8) { animation-delay: 0.7s; }
        .table-row:nth-child(9) { animation-delay: 0.8s; }
        .table-row:nth-child(10) { animation-delay: 0.9s; }
        .table-row:nth-child(11) { animation-delay: 1s; }

        /* Rank Numbers - Gold & Shimmer */
        .rank {
            font-weight: 900;
            font-size: 20px;
            background: linear-gradient(
                135deg,
                #ffff00,
                #ffbe0b,
                #fb5607,
                #ff006e
            );
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rankShimmer 2.5s ease infinite;
            filter: drop-shadow(0 0 8px rgba(255, 190, 11, 0.8));
            text-shadow: 0 0 15px rgba(255, 190, 11, 0.6);
        }

        /* First place - Extra special */
        .table-row:nth-child(2) .rank {
            font-size: 24px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 1));
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
        }

        .student-name {
            font-weight: 800;
            color: #06ffa5;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(6, 255, 165, 0.4);
        }

        .student-roll {
            font-size: 12px;
            color: rgba(6, 255, 165, 0.7);
            margin-top: 4px;
        }

        .score {
            background: linear-gradient(135deg, rgba(6, 255, 165, 0.25), rgba(51, 134, 255, 0.25));
            border: 2px solid rgba(6, 255, 165, 0.6);
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 800;
            color: #06ffa5;
            text-align: center;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(6, 255, 165, 0.4);
            transition: all 0.3s ease;
        }

        .score:hover {
            box-shadow: 0 0 25px rgba(6, 255, 165, 0.7);
            transform: scale(1.05);
        }

        .time {
            background: linear-gradient(135deg, rgba(131, 56, 236, 0.25), rgba(255, 0, 110, 0.25));
            border: 2px solid rgba(131, 56, 236, 0.6);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #c7b3ff;
            text-align: center;
            box-shadow: 0 0 15px rgba(131, 56, 236, 0.4);
            transition: all 0.3s ease;
        }

        .time:hover {
            box-shadow: 0 0 25px rgba(131, 56, 236, 0.7);
            transform: scale(1.05);
        }

        /* ===== CELEBRATION ANIMATIONS ===== */

        @keyframes celebrationGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes heroPulse {
            0%, 100% { 
                transform: scale(1);
                filter: brightness(1);
            }
            50% { 
                transform: scale(1.02);
                filter: brightness(1.15);
            }
        }

        @keyframes trophyBounce {
            0%, 100% { 
                transform: translateY(0) scale(1);
            }
            50% { 
                transform: translateY(-15px) scale(1.1);
            }
        }

        @keyframes particleFloat {
            0%, 100% { 
                opacity: 0.3;
                transform: translateY(0);
            }
            50% { 
                opacity: 0.8;
                transform: translateY(-20px);
            }
        }

        @keyframes shimmer {
            0%, 100% { 
                opacity: 0.4;
            }
            50% { 
                opacity: 0.8;
            }
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        @keyframes rankShimmer {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        @keyframes tableGlow {
            0%, 100% { 
                box-shadow: 
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 80px rgba(51, 134, 255, 0.3),
                    inset 0 0 40px rgba(131, 56, 236, 0.1);
            }
            50% { 
                box-shadow: 
                    0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 120px rgba(255, 0, 110, 0.4),
                    inset 0 0 50px rgba(131, 56, 236, 0.2);
            }
        }

        @keyframes headerGlow {
            0%, 100% { 
                text-shadow: 0 0 10px rgba(6, 255, 165, 0.5);
            }
            50% { 
                text-shadow: 0 0 20px rgba(6, 255, 165, 0.9);
            }
        }

        @keyframes rowDropIn {
            from {
                opacity: 0;
                transform: translateY(-30px) rotateX(10deg);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
                filter: blur(0);
            }
        }

        /* Back button styling */
        .winners-back-wrap {
            grid-column: 1 / -1;
            animation: backButtonDrop 0.5s ease-out both;
        }

        .winners-back-btn {
            border: 2px solid rgba(168, 85, 247, 0.5);
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #06ffa5;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .winners-back-btn:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.8);
            transform: translateY(-2px);
        }

        @keyframes backButtonDrop {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Respect user preferences */
        @media (prefers-reduced-motion: reduce) {
            .winners-hero,
            .winners-table,
            .table-header,
            .table-row,
            .rank,
            .winners-icon {
                animation: none !important;
            }
            
            .table-row::before {
                display: none;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-wrap: wrap;
                justify-content: space-between;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .profile-card {
                grid-template-columns: 1fr;
                padding: 24px;
                gap: 20px;
            }

            .quiz-grid {
                grid-template-columns: 1fr;
            }

            .table-header,
            .table-row {
                grid-template-columns: 34px minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, .7fr) minmax(0, .6fr);
                gap: 10px;
            }

            .time {
                display: none;
            }

            .quiz-card {
                min-height: auto;
            }

            .tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .tab {
                padding: 12px 16px;
                white-space: nowrap;
            }

            .winners-hero {
                padding: 30px 20px;
            }

            .winners-icon {
                font-size: 48px;
            }

            .winners-hero h3 {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                padding: 0 12px;
                gap: 10px;
            }

            .logo {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .brand-text h1 {
                font-size: 16px;
            }

            .brand-text p {
                font-size: 9px;
            }

            .container {
                padding: 0 12px 40px;
            }

            .profile-card {
                padding: 18px;
                margin-bottom: 25px;
            }

            .profile-info h2 {
                font-size: 22px;
            }

            .stats-grid {
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .quiz-card {
                padding: 18px;
            }

            .quiz-card h3 {
                font-size: 14px;
            }

            .logout-btn {
                padding: 8px 12px;
                font-size: 10px;
            }

            .winners-hero {
                padding: 20px 16px;
                margin-bottom: 20px;
            }

            .winners-icon {
                font-size: 40px;
                margin-bottom: 12px;
            }

            .winners-hero h3 {
                font-size: 18px;
            }

            .winners-hero p {
                font-size: 12px;
            }

            .table-header,
            .table-row {
                grid-template-columns: 30px minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, .62fr) minmax(0, .58fr);
                gap: 3px;
                padding: 9px 5px;
                font-size: 10px;
            }
        }
    </style>

</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="brand">
                <div class="logo">ECE</div>
                <div class="brand-text">
                    <h1>Engineers Day Quiz</h1>
                    <p>Student Portal</p>
                </div>
            </div>
            <button class="logout-btn" id="logout">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Profile Card -->
        <section class="profile-card">
            <div class="profile-info">
                <h2 id="welcome">Welcome</h2>
                <p id="studentInfo">Loading your profile...</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="quizCount">0</span>
                    <span class="stat-label">Available</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="scoreCount">0</span>
                    <span class="stat-label">Attempted</span>
                </div>
            </div>
        </section>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="quizzes">Available Quizzes</button>
            <button class="tab" data-tab="completed">Completed</button>
        </div>

        <!-- Quizzes Section -->
        <section class="section active" id="quizzes">
            <h3 class="section-title">Available Quizzes</h3>
            <div class="quiz-grid" id="quizGrid"></div>
        </section>

        <!-- Winners Section -->
        <section class="section" id="completed">
            <h3 class="section-title">Completed</h3>
            <div class="quiz-grid" id="completedGrid"></div>
        </section>
    </main>

    <script>
        let student = null;

        async function api(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Request failed.");
            return data;
        }

        async function load() {
            try {
                const me = await api("/api/student/me");
                student = me.student;

                document.getElementById("welcome").textContent = `Welcome, ${student.name}`;
                document.getElementById("studentInfo").textContent = 
                    `${student.roll_no} • Section ${student.section} • Year ${student.year}`;

                const quizData = await api("/api/student/quizzes");
                renderQuizzes(quizData.quizzes);
                renderCompleted(quizData.quizzes);

                const attempted = quizData.quizzes.filter(q => q.attempted).length;
                document.getElementById("scoreCount").textContent = attempted;

            } catch (error) {
                alert(error.message);
                location.href = "/student/login";
            }
        }

        function renderQuizzes(list) {
            // Available = ONLY running quizzes that are NOT attempted.
            // Completed quizzes must never appear here.
            const available = list.filter(
                q => q.status === "running" && !q.attempted
            );

            document.getElementById("quizCount").textContent = available.length;

            const box = document.getElementById("quizGrid");

            if (!available.length) {
                box.innerHTML = `
                    <div class="empty-state">
                        <p>No quizzes are available yet.</p>
                    </div>
                `;
                return;
            }

            box.innerHTML = available.map(q => `
                <article class="quiz-card">
                    <h3>${escapeHTML(q.title)}</h3>
                    <p>${escapeHTML(q.description || "Test your knowledge and skills in this quiz.")}</p>
                    <div class="quiz-meta">
                        <span class="badge">Available</span>
                    </div>
                    <button class="quiz-btn"
                        onclick="startQuiz('${q.id}')">
                        Start Quiz
                    </button>
                    <button class="quiz-btn completed-btn"
                        onclick="openWinners('${q.id}')"
                        style="margin-top:8px;">
                        🏆 Winners
                    </button>
                </article>
            `).join("");
        }

        function renderCompleted(list) {
            // Completed = student attempted OR admin marked quiz completed.
            const completed = list.filter(
                q => q.attempted || q.status === "completed"
            );

            const box = document.getElementById("completedGrid");
            if (!box) return;

            if (!completed.length) {
                box.innerHTML = `
                    <div class="empty-state">
                        <p>No completed quizzes yet.</p>
                    </div>
                `;
                return;
            }

            box.innerHTML = completed.map(q => `
                <article class="quiz-card">
                    <h3>${escapeHTML(q.title)}</h3>
                    <p>${escapeHTML(q.description || "Quiz completed successfully.")}</p>
                    <div class="quiz-meta">
                        <span class="badge success">✓ Completed</span>
                    </div>
                    <button class="quiz-btn completed-btn"
                        onclick="openWinners('${q.id}')">
                        🏆 Winners
                    </button>
                </article>
            `).join("");
        }

        function formatTime(seconds) {
            const total = Number(seconds || 0);
            const minutes = Math.floor(total / 60);
            const secs = total % 60;
            return `${minutes}m ${String(secs).padStart(2, "0")}s`;
        }

        async function closeWinners() {
            try {
                const quizData = await api("/api/student/quizzes");
                renderQuizzes(quizData.quizzes);
                renderCompleted(quizData.quizzes);

                document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
                document.querySelectorAll(".section").forEach(x => x.classList.remove("active"));

                const completedTab = document.querySelector('[data-tab="completed"]');
                const completedSection = document.getElementById("completed");

                if (completedTab) completedTab.classList.add("active");
                if (completedSection) completedSection.classList.add("active");

                window.scrollTo({ top: 0, behavior: "smooth" });
            } catch (error) {
                alert(error.message);
            }
        }

        async function openWinners(id) {
            try {
                const data = await api("/api/student/winners/" + id);

                const box = document.getElementById("completedGrid");
                if (!box) return;

                if (!data.revealed) {
                    box.innerHTML = `
                        <div class="empty-state">
                            <p>🏆 Winners have not been declared yet. Check back later!</p>
                        </div>
                    `;
                } else {
                    const winners = data.winners || [];

                    if (!winners.length) {
                        box.innerHTML = `
                            <div class="empty-state">
                                <p>No winners have been declared yet.</p>
                            </div>
                        `;
                    } else {
                        box.innerHTML = `
                            <div class="winners-back-wrap" style="grid-column: 1 / -1;">
                                <button type="button" class="winners-back-btn" onclick="closeWinners()">← Back</button>
                            </div>

                            <div class="winners-hero" style="grid-column: 1 / -1;">
                                <span class="winners-icon">🏆</span>
                                <h3>Winners</h3>
                                <p>${escapeHTML(data.quiz?.title || "Quiz")}</p>
                            </div>

                            <div class="winners-table" style="grid-column: 1 / -1;">
                                <div class="table-header">
                                    <div>Rank</div>
                                    <div>Name</div>
                                    <div>Roll Number</div>
                                    <div>Branch</div>
                                    <div>Sec</div>
                                </div>

                                ${winners.map((w, index) => `
                                    <div class="table-row">
                                        <div class="rank">#${w.position ?? index + 1}</div>
                                        <div class="student-name">${escapeHTML(w.name || "Student")}</div>
                                        <div class="student-roll">${escapeHTML(w.roll_no || "—")}</div>
                                        <div>${escapeHTML(w.branch || "—")}</div>
                                        <div>${escapeHTML(w.section || "—")}</div>
                                    </div>
                                `).join("")}
                            </div>
                        `;
                    }
                }

                document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
                document.querySelectorAll(".section").forEach(x => x.classList.remove("active"));

                const completedTab = document.querySelector('[data-tab="completed"]');
                const completedSection = document.getElementById("completed");

                if (completedTab) completedTab.classList.add("active");
                if (completedSection) completedSection.classList.add("active");

                window.scrollTo({ top: 0, behavior: "smooth" });
            } catch (error) {
                alert(error.message);
            }
        }

        function startQuiz(id) {
            location.href = "/student/quiz/" + id;
        }

        // Tab switching
        document.querySelectorAll(".tab").forEach(button => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
                document.querySelectorAll(".section").forEach(x => x.classList.remove("active"));
                button.classList.add("active");
                document.getElementById(button.dataset.tab).classList.add("active");
            });
        });

        // Logout
        document.getElementById("logout").addEventListener("click", async () => {
            await fetch("/api/student/logout", { method: "POST" });
            location.href = "/student/login";
        });

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        load();
    </script>
</body>

</html>
