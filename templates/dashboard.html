<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Logic Hunt | Dashboard
</title>



<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
    --bg:#020711;
    --bg2:#07111d;
    --panel:rgba(7,18,31,.78);
    --panel-solid:#081522;
    --panel2:rgba(11,28,44,.9);
    --line:rgba(88,214,255,.18);
    --line2:rgba(103,239,255,.38);
    --text:#effcff;
    --muted:#89a7b8;
    --cyan:#43e7ff;
    --cyan2:#00a8ff;
    --violet:#8d6cff;
    --green:#3dffbd;
    --danger:#ff5e7a;
}

html{scroll-behavior:smooth}

body{
    min-height:100vh;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);
    overflow-x:hidden;
    background:
        radial-gradient(circle at 12% 12%,rgba(0,204,255,.13),transparent 24%),
        radial-gradient(circle at 88% 18%,rgba(141,108,255,.12),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(0,255,190,.07),transparent 28%),
        linear-gradient(135deg,#01050c 0%,#04101b 52%,#020711 100%);
}

/* Electronics circuit-board atmosphere */
body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.34;
    background-image:
        linear-gradient(rgba(67,231,255,.055) 1px,transparent 1px),
        linear-gradient(90deg,rgba(67,231,255,.055) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:linear-gradient(to bottom,black,transparent 90%);
}

body:after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    right:-170px;
    top:170px;
    border-radius:50%;
    pointer-events:none;
    background:rgba(0,210,255,.07);
    filter:blur(80px);
}

.header{
    max-width:1220px;
    margin:auto;
    padding:26px 22px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:relative;
    z-index:2;
}

.brand{display:flex;align-items:center;gap:14px}

.logo{
    width:58px;height:58px;
    border-radius:17px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    background:
        linear-gradient(145deg,rgba(25,64,82,.95),rgba(3,17,29,.98));
    border:1px solid rgba(67,231,255,.48);
    box-shadow:
        0 0 12px rgba(67,231,255,.42),
        0 0 34px rgba(0,168,255,.16),
        8px 9px 18px rgba(0,0,0,.42),
        inset 2px 2px 5px rgba(255,255,255,.08),
        inset -4px -5px 9px rgba(0,0,0,.45);
    transform:perspective(500px) rotateX(7deg) rotateY(-7deg);
}

.logo:before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:13px;
    border:1px solid rgba(67,231,255,.08);
    pointer-events:none;
}

.gate-icon{
    width:45px;
    height:34px;
    overflow:visible;
    filter:drop-shadow(0 0 5px rgba(67,231,255,.8))
           drop-shadow(0 0 12px rgba(0,168,255,.32));
}

.gate-body{
    fill:rgba(67,231,255,.09);
    stroke:#73efff;
    stroke-width:2.4;
    stroke-linejoin:round;
}

.gate-line{
    fill:none;
    stroke:#73efff;
    stroke-width:2.4;
    stroke-linecap:round;
}

.gate-dot{
    fill:#c9fbff;
    filter:drop-shadow(0 0 4px #43e7ff);
}

.logo:hover .gate-body,
.logo:hover .gate-line{
    stroke:#d7fcff;
}

.logo:hover .gate-dot{
    fill:#ffffff;
}

.brand h1{
    font-size:22px;
    letter-spacing:.5px;
    text-shadow:0 0 18px rgba(67,231,255,.45);
}

.brand p{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.logout{
    padding:11px 17px;
    border:1px solid var(--line2);
    border-radius:11px;
    color:#d9f8ff;
    background:rgba(5,19,31,.7);
    cursor:pointer;
    box-shadow:inset 0 0 12px rgba(67,231,255,.04),0 0 15px rgba(0,168,255,.08);
    transition:.25s ease;
}

.logout:hover{
    transform:translateY(-2px);
    border-color:var(--cyan);
    box-shadow:0 0 18px rgba(67,231,255,.22);
}

.container{
    max-width:1220px;
    margin:auto;
    padding:16px 22px 60px;
    position:relative;
    z-index:1;
}

.profile{
    position:relative;
    overflow:hidden;
    padding:27px;
    border:1px solid var(--line);
    border-radius:24px;
    background:
        linear-gradient(145deg,rgba(15,35,52,.9),rgba(4,13,24,.84));
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    box-shadow:
        0 22px 50px rgba(0,0,0,.35),
        inset 1px 1px 0 rgba(255,255,255,.05),
        inset -2px -3px 0 rgba(0,0,0,.28),
        0 0 35px rgba(0,168,255,.06);
    transform:perspective(1100px) rotateX(.7deg);
}

.profile:before{
    content:"";
    position:absolute;
    width:230px;height:230px;
    right:-90px;top:-120px;
    border-radius:50%;
    border:1px solid rgba(67,231,255,.18);
    box-shadow:0 0 35px rgba(67,231,255,.09);
}

.profile:after{
    content:"";
    position:absolute;
    left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    box-shadow:0 0 15px var(--cyan);
    opacity:.55;
}

.profile h2{font-size:27px;letter-spacing:.2px}
.profile p{color:var(--muted);margin-top:7px;font-size:12px}

.stats{display:flex;gap:13px}

.stat{
    min-width:112px;
    padding:16px 18px;
    border-radius:15px;
    text-align:center;
    background:linear-gradient(145deg,rgba(19,48,68,.8),rgba(4,16,27,.92));
    border:1px solid var(--line);
    box-shadow:
        7px 7px 15px rgba(0,0,0,.28),
        -3px -3px 9px rgba(67,231,255,.025),
        inset 1px 1px 2px rgba(255,255,255,.04);
    transition:.25s ease;
}

.stat:hover{transform:translateY(-4px) rotateX(3deg);border-color:var(--line2)}
.stat strong{display:block;font-size:22px;color:#dfffff;text-shadow:0 0 14px rgba(67,231,255,.45)}
.stat span{font-size:9px;color:var(--muted);letter-spacing:1.5px}

.tabs{
    display:flex;
    gap:10px;
    margin:26px 0 18px;
    padding:6px;
    width:max-content;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(3,12,21,.72);
    box-shadow:inset 0 0 20px rgba(0,168,255,.035);
}

.tab{
    padding:11px 17px;
    border:1px solid transparent;
    border-radius:10px;
    background:transparent;
    color:#91adbd;
    cursor:pointer;
    transition:.25s ease;
}

.tab:hover{color:#eaffff;background:rgba(67,231,255,.05)}
.tab.active{
    color:#eaffff;
    border-color:rgba(67,231,255,.42);
    background:linear-gradient(145deg,rgba(67,231,255,.16),rgba(0,168,255,.05));
    box-shadow:0 0 16px rgba(67,231,255,.11),inset 0 0 12px rgba(67,231,255,.04);
}

.section{display:none}
.section.active{display:block}

.section-title{
    font-size:18px;
    margin-bottom:15px;
    letter-spacing:.3px;
    color:#dcfaff;
    text-shadow:0 0 12px rgba(67,231,255,.18);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.quiz-card{
    position:relative;
    overflow:hidden;
    padding:23px;
    min-height:220px;
    border:1px solid var(--line);
    border-radius:20px;
    background:
        linear-gradient(145deg,rgba(11,31,47,.94),rgba(3,12,21,.94));
    box-shadow:
        12px 15px 28px rgba(0,0,0,.34),
        -3px -3px 10px rgba(67,231,255,.025),
        inset 1px 1px 0 rgba(255,255,255,.045);
    transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
    transform:perspective(900px) rotateX(0deg) rotateY(0deg);
}

.quiz-card:before{
    content:"";
    position:absolute;
    width:120px;height:120px;
    right:-45px;top:-50px;
    border-radius:50%;
    border:1px solid rgba(67,231,255,.16);
    box-shadow:0 0 25px rgba(67,231,255,.08);
}

.quiz-card:after{
    content:"";
    position:absolute;
    left:18px;right:18px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:.55;
    box-shadow:0 0 10px var(--cyan);
}

.quiz-card:hover{
    transform:perspective(900px) translateY(-8px) rotateX(2deg) rotateY(-1deg);
    border-color:rgba(67,231,255,.48);
    box-shadow:
        16px 22px 35px rgba(0,0,0,.42),
        0 0 28px rgba(0,168,255,.12),
        inset 1px 1px 0 rgba(255,255,255,.06);
}

.quiz-card h3{font-size:18px;color:#f1feff}
.quiz-card p{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.65;min-height:38px}

.meta{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}
.pill{
    padding:6px 10px;
    border-radius:8px;
    background:rgba(67,231,255,.055);
    border:1px solid rgba(67,231,255,.09);
    color:#a9c8d5;
    font-size:10px;
}

.pill.done{
    color:#7fffd0;
    background:rgba(61,255,189,.07);
    border-color:rgba(61,255,189,.18);
}

.start{
    width:100%;
    height:44px;
    border:1px solid rgba(123,241,255,.38);
    border-radius:11px;
    color:#00141b;
    background:linear-gradient(135deg,#c8faff 0%,#43e7ff 45%,#159dff 100%);
    font-weight:900;
    letter-spacing:.6px;
    cursor:pointer;
    box-shadow:
        0 7px 18px rgba(0,168,255,.18),
        0 0 15px rgba(67,231,255,.15),
        inset 1px 1px 2px rgba(255,255,255,.9),
        inset -2px -3px 5px rgba(0,90,140,.3);
    transition:.2s ease;
}

.start:hover{
    transform:translateY(-2px);
    box-shadow:
        0 10px 22px rgba(0,168,255,.25),
        0 0 25px rgba(67,231,255,.25),
        inset 1px 1px 2px rgba(255,255,255,.9);
}

.start:active{transform:translateY(1px)}
.start.done{
    background:linear-gradient(145deg,#172d39,#0c1b26);
    color:#68818e;
    border-color:rgba(120,170,185,.12);
    box-shadow:none;
    cursor:default;
}

.empty{
    padding:38px;
    text-align:center;
    color:var(--muted);
    border:1px dashed rgba(67,231,255,.22);
    border-radius:17px;
    background:rgba(5,18,29,.5);
}

/* Winners / result panels */
.notice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-top:16px}
.notice-card,.script-question{
    padding:22px;
    border:1px solid var(--line);
    border-radius:18px;
    background:linear-gradient(145deg,rgba(11,31,47,.92),rgba(3,12,21,.94));
    box-shadow:10px 13px 24px rgba(0,0,0,.3),inset 1px 1px 0 rgba(255,255,255,.04);
}
.notice-card h4{font-size:16px;margin-bottom:7px}
.notice-card p{color:var(--muted);font-size:11px;line-height:1.6;margin-bottom:14px}
.notice-card.hidden{opacity:.72}

.notice-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:8px;
    font-size:9px;
    font-weight:800;
    margin-bottom:12px;
    background:rgba(141,108,255,.12);
    color:#cfc5ff;
    border:1px solid rgba(141,108,255,.16);
}
.notice-badge.live{background:rgba(61,255,189,.08);color:#7fffd0;border-color:rgba(61,255,189,.16)}


/* =========================
   FULL-SCREEN WINNERS CELEBRATION
   ========================= */

.qualification-hero{
    position:relative;
    overflow:hidden;
    margin-bottom:22px;
    padding:34px 28px 30px;
    border:1px solid rgba(67,231,255,.30);
    border-radius:24px;
    text-align:center;
    background:
        radial-gradient(circle at 50% 20%,rgba(67,231,255,.18),transparent 32%),
        linear-gradient(145deg,rgba(12,38,57,.96),rgba(3,13,23,.97));
    box-shadow:
        0 25px 60px rgba(0,0,0,.42),
        0 0 55px rgba(67,231,255,.12),
        inset 1px 1px 0 rgba(255,255,255,.06);
    animation:qualificationReveal .65s ease both;
}

.qualification-hero:before,
.qualification-hero:after{
    content:"";
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.qualification-hero:before{
    width:280px;height:280px;
    left:-140px;top:-180px;
    border:1px solid rgba(67,231,255,.18);
    box-shadow:
        0 0 0 22px rgba(67,231,255,.025),
        0 0 0 44px rgba(67,231,255,.018),
        0 0 50px rgba(67,231,255,.08);
}

.qualification-hero:after{
    width:230px;height:230px;
    right:-115px;bottom:-150px;
    border:1px solid rgba(141,108,255,.20);
    box-shadow:
        0 0 0 20px rgba(141,108,255,.025),
        0 0 0 40px rgba(141,108,255,.015),
        0 0 50px rgba(141,108,255,.08);
}

/* Full celebration field */
.celebration-rays{
    position:fixed;
    inset:0;
    z-index:99999;
    pointer-events:none;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 42%,rgba(67,231,255,.055),transparent 30%),
        radial-gradient(circle at 20% 70%,rgba(141,108,255,.045),transparent 28%),
        radial-gradient(circle at 82% 72%,rgba(61,255,189,.045),transparent 28%);
}

/* Firework bursts */
.celebration-rays span{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#bdfbff;
    box-shadow:
        0 0 6px #43e7ff,
        0 0 16px #43e7ff,
        0 0 30px rgba(67,231,255,.8);
    animation:firework 2.8s ease-out infinite;
}

/* Each span becomes a burst with many rays through box-shadow */
.celebration-rays span:before,
.celebration-rays span:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:4px;
    height:105px;
    transform-origin:50% 0;
    border-radius:999px;
    background:linear-gradient(to bottom,#dfffff,rgba(67,231,255,.65),transparent);
    box-shadow:
        0 0 8px #43e7ff,
        0 0 15px rgba(67,231,255,.55);
}

.celebration-rays span:before{
    transform:translate(-50%,0) rotate(0deg);
}
.celebration-rays span:after{
    transform:translate(-50%,0) rotate(90deg);
}

/* Four diagonal rays around every burst using additional shadows */
.celebration-rays span:nth-child(1){
    left:13%;top:23%;animation-delay:.1s;
    box-shadow:0 0 6px #fff,0 0 16px #43e7ff,0 0 30px #43e7ff,
               42px 42px 0 #7b61ff,-42px 42px 0 #3dffbd,
               42px -42px 0 #43e7ff,-42px -42px 0 #c9baff;
}
.celebration-rays span:nth-child(2){
    left:84%;top:21%;animation-delay:.8s;
    background:#d5caff;
    box-shadow:0 0 6px #fff,0 0 17px #8d6cff,0 0 32px #8d6cff,
               40px 40px 0 #43e7ff,-40px 40px 0 #3dffbd,
               40px -40px 0 #ff79bd,-40px -40px 0 #c9baff;
}
.celebration-rays span:nth-child(3){
    left:24%;top:76%;animation-delay:1.35s;
    background:#8effd5;
    box-shadow:0 0 6px #fff,0 0 17px #3dffbd,0 0 32px #3dffbd,
               44px 44px 0 #43e7ff,-44px 44px 0 #8d6cff,
               44px -44px 0 #ffcf66,-44px -44px 0 #43e7ff;
}
.celebration-rays span:nth-child(4){
    left:76%;top:74%;animation-delay:1.8s;
    background:#ffe08a;
    box-shadow:0 0 6px #fff,0 0 17px #ffcf66,0 0 32px #ffcf66,
               44px 44px 0 #ff79bd,-44px 44px 0 #43e7ff,
               44px -44px 0 #3dffbd,-44px -44px 0 #8d6cff;
}
.celebration-rays span:nth-child(5){
    left:49%;top:12%;animation-delay:2.2s;
    background:#ffb9dc;
    box-shadow:0 0 6px #fff,0 0 17px #ff79bd,0 0 32px #ff79bd,
               44px 44px 0 #43e7ff,-44px 44px 0 #3dffbd,
               44px -44px 0 #8d6cff,-44px -44px 0 #ffcf66;
}
.celebration-rays span:nth-child(6){
    left:51%;top:83%;animation-delay:2.55s;
    background:#a7f6ff;
    box-shadow:0 0 6px #fff,0 0 17px #43e7ff,0 0 32px #43e7ff,
               42px 42px 0 #ff79bd,-42px 42px 0 #8d6cff,
               42px -42px 0 #3dffbd,-42px -42px 0 #ffcf66;
}

.qualification-icon{
    position:relative;
    z-index:100001;
    width:84px;height:84px;
    margin:0 auto 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(61,255,189,.48);
    border-radius:50%;
    color:#03150f;
    background:linear-gradient(145deg,#c0ffe9,#3dffbd);
    box-shadow:
        0 0 0 8px rgba(61,255,189,.055),
        0 0 38px rgba(61,255,189,.35),
        inset 2px 2px 6px rgba(255,255,255,.7);
    font-size:39px;
    font-weight:950;
    animation:medalPop .8s cubic-bezier(.2,1.5,.35,1) both;
}

.qualification-kicker{
    position:relative;
    z-index:100001;
    display:inline-block;
    padding:7px 13px;
    margin-bottom:11px;
    border:1px solid rgba(61,255,189,.22);
    border-radius:999px;
    color:#79ffd2;
    background:rgba(61,255,189,.08);
    font-size:9px;
    font-weight:950;
    letter-spacing:1.7px;
}

.qualification-title{
    position:relative;
    z-index:100001;
    color:#f5feff;
    font-size:30px;
    font-weight:950;
    line-height:1.18;
    text-shadow:0 0 20px rgba(67,231,255,.22),0 3px 18px rgba(0,0,0,.35);
}

.qualification-title .highlight{
    color:#5fffd0;
    text-shadow:0 0 20px rgba(61,255,189,.42);
}

.qualification-divider{
    position:relative;
    z-index:100001;
    width:min(430px,80%);
    height:1px;
    margin:20px auto 0;
    background:linear-gradient(90deg,transparent,#43e7ff,transparent);
    box-shadow:0 0 14px rgba(67,231,255,.3);
}

.qualification-subtitle{
    position:relative;
    z-index:100001;
    margin-top:14px;
    color:#dffcff;
    font-size:12px;
    font-weight:850;
    letter-spacing:.4px;
}

@keyframes qualificationReveal{
    from{opacity:0;transform:translateY(15px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes medalPop{
    0%{opacity:0;transform:scale(.3) rotate(-18deg)}
    65%{transform:scale(1.12) rotate(4deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}
}

@keyframes firework{
    0%{opacity:0;transform:scale(.2)}
    10%{opacity:1;transform:scale(1)}
    35%{opacity:.95;transform:scale(1.25)}
    70%{opacity:.45;transform:scale(.8)}
    100%{opacity:0;transform:scale(.25)}
}

@media(max-width:700px){
    .qualification-hero{
        padding:25px 15px 22px;
        border-radius:19px;
    }

    .qualification-icon{
        width:66px;height:66px;font-size:30px;
    }

    .qualification-title{
        font-size:23px;
    }

    .qualification-subtitle{
        font-size:10px;
    }

    .celebration-rays span:before,
    .celebration-rays span:after{
        height:75px;
    }
}


.winner-table{
    width:100%;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    background:rgba(4,15,25,.72);
    box-shadow:0 14px 30px rgba(0,0,0,.28);
}

.winner-header,
.winner-row{
    display:grid;
    grid-template-columns:70px minmax(180px,1.6fr) minmax(130px,1fr) 120px 130px;
    align-items:center;
    column-gap:14px;
    min-width:690px;
}

.winner-header{
    min-height:48px;
    padding:0 18px;
    color:#79ebff;
    background:linear-gradient(90deg,rgba(67,231,255,.12),rgba(141,108,255,.08));
    border-bottom:1px solid rgba(67,231,255,.22);
    font-size:9px;
    font-weight:900;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.winner-header > div:nth-child(4),
.winner-header > div:nth-child(5){
    text-align:center;
}

.winner-list{display:block}

.winner-row{
    min-height:64px;
    padding:0 18px;
    border-bottom:1px solid rgba(88,214,255,.10);
    background:rgba(6,22,34,.68);
    font-size:11px;
    transition:.25s ease;
}

.winner-row:last-child{border-bottom:0}

.winner-row:hover{
    background:linear-gradient(90deg,rgba(67,231,255,.09),rgba(141,108,255,.05));
}

.winner-position{
    font-size:17px;
    font-weight:900;
    color:#c8bbff;
}

.winner-name{min-width:0}

.winner-name strong{
    display:block;
    color:#f3fdff;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.winner-roll{
    color:#a7c3cf;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.winner-score{
    justify-self:center;
    min-width:76px;
    padding:7px 10px;
    border-radius:9px;
    border:1px solid rgba(61,255,189,.20);
    background:rgba(61,255,189,.07);
    color:#7fffd0;
    font-weight:900;
    text-align:center;
    white-space:nowrap;
}

.winner-time{
    justify-self:center;
    min-width:92px;
    padding:7px 9px;
    border-radius:9px;
    border:1px solid rgba(67,231,255,.16);
    background:rgba(67,231,255,.05);
    color:#bcefff;
    font-size:10px;
    text-align:center;
    white-space:nowrap;
}

@media(max-width:700px){
    .winner-table{
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }

    .winner-header,
    .winner-row{
        grid-template-columns:58px 145px 105px 82px 105px;
        min-width:535px;
        column-gap:8px;
    }

    .winner-header{
        min-height:44px;
        padding:0 10px;
        font-size:8px;
    }

    .winner-row{
        min-height:58px;
        padding:0 10px;
    }

    .winner-name strong{font-size:11px}
}

.script-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:15px 0}
.script-stat{
    padding:14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(6,22,34,.72);
}
.script-stat span{display:block;color:var(--muted);font-size:9px;margin-bottom:5px;letter-spacing:1px}
.script-stat strong{font-size:16px;color:#e8fcff}

.script-list{display:grid;gap:13px;margin-top:16px}
.script-question.correct{border-color:rgba(61,255,189,.28)}
.script-question.wrong{border-color:rgba(255,94,122,.28)}
.script-qtitle{font-weight:800;font-size:12px;line-height:1.55}
.script-options{display:grid;gap:7px;margin-top:12px}
.script-option{
    padding:10px 11px;
    border-radius:9px;
    background:rgba(255,255,255,.025);
    border:1px solid transparent;
    font-size:10px;color:#cfdfe6;
}
.script-option.selected{border-color:rgba(141,108,255,.5)}
.script-option.correct-option{border-color:rgba(61,255,189,.35);color:#8ce8cb}
.script-answer{display:flex;flex-wrap:wrap;gap:10px;margin-top:13px}
.answer-badge{
    padding:6px 9px;border-radius:8px;font-size:9px;font-weight:900;
    background:rgba(255,255,255,.04);color:#b7cbd5;
}
.answer-badge.good{color:#77e4c2;background:rgba(61,255,189,.08)}
.answer-badge.bad{color:#ff9aa9;background:rgba(255,94,122,.08)}
.view-script-btn{
    margin-top:10px;height:38px;padding:0 13px;
    border:1px solid rgba(67,231,255,.25);
    border-radius:9px;color:#bdefff;background:rgba(67,231,255,.07);
    font-size:10px;font-weight:900;cursor:pointer;
}
.script-panel{margin-top:16px}
.refresh-note{margin-top:10px;color:var(--muted);font-size:10px}

/* Responsive */
@media(max-width:700px){
    .header{padding:18px 14px 12px}
    .brand h1{font-size:19px}
    .logo{width:50px;height:50px}
    .container{padding:10px 14px 40px}
    .profile{flex-direction:column;align-items:flex-start;padding:22px}
    .profile h2{font-size:23px}
    .stats{width:100%}
    .stat{flex:1;min-width:0}
    .tabs{width:100%;overflow:auto}
    .tab{flex:1;white-space:nowrap}
    .grid{grid-template-columns:1fr}
    .quiz-card{min-height:auto}
    
    
}

/* Premium circuit traces */
.header:before,
.container:before{
    content:"";
    position:absolute;
    pointer-events:none;
    opacity:.5;
}

.header:before{
    width:180px;
    height:1px;
    left:22px;
    bottom:0;
    background:linear-gradient(90deg,var(--cyan),transparent);
    box-shadow:0 0 10px var(--cyan);
}

.container:before{
    width:110px;
    height:110px;
    right:-35px;
    top:180px;
    border:1px solid rgba(67,231,255,.09);
    border-radius:50%;
    box-shadow:
        0 0 0 18px rgba(67,231,255,.025),
        0 0 0 36px rgba(67,231,255,.015);
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.section-title:before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:#69edff;
    box-shadow:0 0 7px #43e7ff,0 0 17px #00a8ff;
}
.start{
    position:relative;
    overflow:hidden;
}

.start:after{
    content:"";
    position:absolute;
    top:-40%;
    left:-80%;
    width:45%;
    height:180%;
    transform:rotate(20deg);
    background:rgba(255,255,255,.35);
    filter:blur(8px);
    transition:left .5s ease;
}

.start:hover:after{
    left:140%;
}

@keyframes circuitPulse{
    0%,100%{opacity:.35}
    50%{opacity:.9}
}

.gate-dot{
    animation:circuitPulse 2.2s ease-in-out infinite;
}

</style>


</head>



<body>
<div class="circuit-glow" aria-hidden="true"></div>



<header class="header">

    <div class="brand">

        <div class="logo" aria-label="Logic Gate">
            <svg class="gate-icon" viewBox="0 0 80 56" role="img" aria-hidden="true">
                <path class="gate-body" d="M10 8H35C57 8 69 18 69 28S57 48 35 48H10Z"/>
                <path class="gate-line" d="M2 19H10M2 37H10M69 28H78"/>
                <circle class="gate-dot" cx="2" cy="19" r="2.2"/>
                <circle class="gate-dot" cx="2" cy="37" r="2.2"/>
                <circle class="gate-dot" cx="78" cy="28" r="2.2"/>
            </svg>
        </div>

        <div>

            <h1>
                Logic Hunt
            </h1>

            <p>
                Student Portal
            </p>

        </div>

    </div>


    <button
        class="logout"
        id="logout">

        Logout

    </button>

</header>


<main class="container">


<section class="profile">

    <div>

        <h2 id="welcome">
            Welcome
        </h2>

        <p id="studentInfo">
            Loading...
        </p>

    </div>


    <div class="stats">

        <div class="stat">

            <strong id="quizCount">
                0
            </strong>

            <span>
                AVAILABLE
            </span>

        </div>


        <div class="stat">

            <strong id="scoreCount">
                0
            </strong>

            <span>
                ATTEMPTED
            </span>

        </div>

    </div>

</section>


<div class="tabs">

    <button
        class="tab active"
        data-tab="quizzes">

        Available Quizzes

    </button>
<button
        class="tab"
        data-tab="winners">

        Winners

    </button>

</div>


<section
    class="section active"
    id="quizzes">

    <h3 class="section-title">

        Quizzes for your year

    </h3>


    <div
        class="grid"
        id="quizGrid">

    </div>

</section>
<section
    class="section"
    id="winners"
>

    <h3 class="section-title">
        Winners
    </h3>

    <div id="winnersBox">
    </div>

</section>


</main>


<script>

let student = null;


async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            options
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed."
        );

    }


    return data;

}


async function load() {

    try {

        const me =
            await api(
                "/api/student/me"
            );


        student =
            me.student;


        document
        .getElementById("welcome")
        .textContent =
            `Welcome, ${student.name}`;


        document
        .getElementById("studentInfo")
        .textContent =
            `${student.roll_no} • Section ${student.section} • Year ${student.year}`;


        const quizData =
            await api(
                "/api/student/quizzes"
            );


        renderQuizzes(
            quizData.quizzes
        );


        const attempted =
            quizData.quizzes
            .filter(q => q.attempted)
            .length;


        document
        .getElementById("scoreCount")
        .textContent =
            attempted;
await loadDashboardDeclarations(
            quizData.quizzes
        );


    } catch (error) {

        alert(error.message);

        location.href =
            "/student/login";

    }

}


function renderQuizzes(list) {

    document
    .getElementById("quizCount")
    .textContent =
        list.length;


    const box =
        document.getElementById(
            "quizGrid"
        );


    if (!list.length) {

        box.innerHTML =
            `
            <div class="empty">
                No active quizzes are
                available for your year.
            </div>
            `;

        return;

    }


    box.innerHTML =
        list.map(q => {

            const done =
                q.attempted;


            return `

            <article
                class="quiz-card">

                <h3>
                    ${escapeHTML(q.title)}
                </h3>


                <p>
                    ${escapeHTML(
                        q.description ||
                        "Get ready and test your knowledge."
                    )}
                </p>


                <div class="meta">

                    <span class="pill">

                        Year
                        ${escapeHTML(q.year)}

                    </span>


                    ${
                        done

                        ?

                        `<span
                            class="pill done">

                            ✓ Attempted

                        </span>`

                        :

                        `<span
                            class="pill">

                            Available

                        </span>`
                    }

                </div>


                <button

                    class="
                        start
                        ${done ? "done" : ""}
                    "

                    ${
                        done
                        ? "disabled"
                        : ""
                    }

                    onclick="
                        startQuiz('${q.id}')
                    "
                >

                    ${
                        done
                        ?
                        "ALREADY ATTEMPTED"
                        :
                        "START QUIZ →"
                    }

                </button>

            </article>

            `;

        }).join("");

}


function formatTime(seconds) {

    const total = Number(seconds || 0);

    const minutes = Math.floor(total / 60);
    const secs = total % 60;

    return `${minutes}m ${String(secs).padStart(2, "0")}s`;
}


function renderWinners(data, quizzes){

    const box = document.getElementById("winnersBox");

    if(!box) return;

    if(!quizzes.length){
        box.innerHTML = `
            <div class="empty">
                No quizzes available.
            </div>
        `;
        return;
    }

    if(!data.revealed){
        box.innerHTML = `
            <div class="empty">
                Winners have not been declared yet.
            </div>
        `;
        return;
    }

    const winners = data.winners || [];

    if(!winners.length){
        box.innerHTML = `
            <div class="empty">
                No winners have been selected.
            </div>
        `;
        return;
    }

    box.innerHTML = `
        <div class="qualification-hero">

            <div class="celebration-rays" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="qualification-icon">✓</div>

            <div class="qualification-kicker">
                LOGIC HUNT • RESULT DECLARED
            </div>

            <div class="qualification-title">
                Congratulations!
                <br>
                <span class="highlight">
                    You Qualified for Round 2
                </span>
            </div>

            <p class="qualification-message">            </p>

            <div class="qualification-divider"></div>

            <div class="qualification-subtitle">
                🏆 Qualified Participants — ${escapeHTML(data.quiz.title)}
            </div>

        </div>
        <div class="winner-table">

            <div class="winner-header">
                <div>RANK</div>
                <div>NAME</div>
                <div>ROLL NO</div>
                <div>MARKS</div>
                <div>TIME TAKEN</div>
            </div>

            <div class="winner-list">

                ${
                    winners.map(
                        winner => `
                            <div class="winner-row">

                                <div class="winner-position">
                                    #${winner.position}
                                </div>

                                <div class="winner-name">
                                    <strong>
                                        ${escapeHTML(winner.name)}
                                    </strong>
                                </div>

                                <div class="winner-roll">
                                    ${escapeHTML(winner.roll_no)}
                                </div>

                                <div class="winner-score">
                                    ${winner.score}/${winner.total_questions}
                                </div>

                                <div class="winner-time">
                                    ${formatTime(winner.total_time_taken)}
                                </div>

                            </div>
                        `
                    ).join("")
                }

            </div>
        </div>
    `;
}


function renderResultsForQuiz(scores) {

    const box =
        document.getElementById("scoresBox");

    if (!box) return;

    if (!scores.length) {
        box.innerHTML = `
            <div class="empty">
                You have not attempted any quizzes yet.
            </div>
        `;
        return;
    }

    box.innerHTML = `
        <div class="script-list">

            ${
                scores.map(
                    s => `
                        <article class="notice-card">

                            <h4>
                                ${escapeHTML(s.title)}
                            </h4>

                            ${
                                s.results_revealed
                                ?
                                `
                                    <div class="script-summary">

                                        <div class="script-stat">
                                            <span>SCORE</span>
                                            <strong>
                                                ${s.score}/${s.total_questions}
                                            </strong>
                                        </div>

                                        <div class="script-stat">
                                            <span>ANSWERED</span>
                                            <strong>
                                                ${s.answered_questions}/${s.total_questions}
                                            </strong>
                                        </div>

                                        <div class="script-stat">
                                            <span>TIME</span>
                                            <strong>
                                                ${formatTime(s.total_time_taken)}
                                            </strong>
                                        </div>

                                    </div>

                                    <a
                                        class="view-script-btn"
                                        href="/student/script?quiz_id=${encodeURIComponent(s.quiz_id)}"
                                        style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;"
                                    >
                                        VIEW MY SCRIPT
                                    </a>

                                    <div
                                        class="script-panel"
                                        id="script-${s.quiz_id}"
                                    ></div>
                                `
                                :
                                `
                                    <span class="notice-badge">
                                        NOT DECLARED
                                    </span>

                                    <p>
                                        Your result and script are waiting
                                        for the admin to declare results.
                                    </p>
                                `
                            }

                        </article>
                    `
                ).join("")
            }

        </div>
    `;
}


async function loadStudentScript(quizId) {

    openedScriptQuizId = quizId;

    const panel =
        document.getElementById("script-" + quizId);

    if (!panel) return;

    panel.innerHTML = `
        <div class="empty">
            Loading your script...
        </div>
    `;

    try {

        const data =
            await api(
                "/api/student/script/" + quizId
            );

        if (!data.revealed) {

            openedScriptQuizId = null;

            panel.innerHTML = `
                <div class="empty">
                    Your script has not been declared yet.
                </div>
            `;

            return;
        }

        const summary = data.summary || {};
        const script = data.script || [];

        panel.innerHTML = `
            <div class="script-summary">

                <div class="script-stat">
                    <span>SCORE</span>
                    <strong>
                        ${summary.score}/${summary.total_questions}
                    </strong>
                </div>

                <div class="script-stat">
                    <span>TIME TAKEN</span>
                    <strong>
                        ${formatTime(summary.total_time_taken)}
                    </strong>
                </div>

            </div>

            <div class="script-list">

                ${
                    script.map(
                        q => {

                            const statusClass =
                                q.is_correct
                                ? "correct"
                                : "wrong";

                            const statusText =
                                q.submitted_answer == null
                                ? "NOT ANSWERED"
                                : (
                                    q.is_correct
                                    ? "CORRECT"
                                    : "WRONG"
                                );

                            const options =
                                q.options || {};

                            return `
                                <article
                                    class="script-question ${statusClass}"
                                >

                                    <div class="script-qtitle">
                                        Q${q.number}.
                                        ${escapeHTML(
                                            q.question_text || ""
                                        )}
                                    </div>

                                    <div class="script-options">

                                        ${
                                            ["A","B","C","D"].map(
                                                letter => {

                                                    const value =
                                                        options[letter] || "";

                                                    const isSelected =
                                                        q.submitted_answer != null &&
                                                        String(q.submitted_answer)
                                                            .trim()
                                                            .toUpperCase()
                                                        === letter;

                                                    const isCorrect =
                                                        q.correct_answer != null &&
                                                        String(q.correct_answer)
                                                            .trim()
                                                            .toUpperCase()
                                                        === letter;

                                                    return `
                                                        <div class="
                                                            script-option
                                                            ${isSelected ? "selected" : ""}
                                                            ${isCorrect ? "correct-option" : ""}
                                                        ">
                                                            <b>${letter}.</b>
                                                            ${escapeHTML(value)}

                                                            ${
                                                                isSelected
                                                                ? " — Your answer"
                                                                : ""
                                                            }

                                                            ${
                                                                isCorrect
                                                                ? " — Correct answer"
                                                                : ""
                                                            }
                                                        </div>
                                                    `;
                                                }
                                            ).join("")
                                        }

                                    </div>

                                    <div class="script-answer">

                                        <span class="
                                            answer-badge
                                            ${q.is_correct ? "good" : "bad"}
                                        ">
                                            ${statusText}
                                        </span>

                                        ${
                                            q.submitted_answer == null
                                            ?
                                            `
                                                <span class="answer-badge bad">
                                                    Your answer: Not answered
                                                </span>
                                            `
                                            :
                                            `
                                                <span class="answer-badge">
                                                    Your answer:
                                                    ${escapeHTML(
                                                        String(
                                                            q.submitted_answer
                                                        )
                                                    )}
                                                </span>
                                            `
                                        }

                                        <span class="answer-badge good">
                                            Correct:
                                            ${escapeHTML(
                                                String(
                                                    q.correct_answer || ""
                                                )
                                            )}
                                        </span>

                                    </div>

                                </article>
                            `;
                        }
                    ).join("")
                }

            </div>
        `;

    } catch (error) {

        console.error(
            "Script load failed:",
            error
        );

        panel.innerHTML = `
            <div class="empty">
                Unable to load your script right now.
            </div>
        `;
    }
}





async function loadDashboardDeclarations(quizzes) {

    // Load the first quiz whose winners are declared.
    let winnersData = {
        revealed: false,
        winners: []
    };

    const winnersQuiz =
        quizzes.find(q => q.winners_revealed);

    if (winnersQuiz) {

        try {
            winnersData =
                await api(
                    "/api/student/winners/" +
                    winnersQuiz.id
                );
        } catch (error) {
            console.error(
                "Winners load failed:",
                error
            );
        }
    }

    renderWinners(
        winnersData,
        quizzes
    );
}




function startQuiz(id) {

    location.href =
        "/student/quiz/" + id;

}


document
.querySelectorAll(".tab")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".tab")
            .forEach(
                x =>
                    x.classList
                    .remove("active")
            );


            document
            .querySelectorAll(".section")
            .forEach(
                x =>
                    x.classList
                    .remove("active")
            );


            button
            .classList
            .add("active");


            document
            .getElementById(
                button.dataset.tab
            )
            .classList
            .add("active");

        }
    );

});


document
.getElementById("logout")
.addEventListener(
    "click",
    async () => {

        await fetch(
            "/api/student/logout",
            {
                method: "POST"
            }
        );


        location.href =
            "/student/login";

    }
);


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


load();

/*
 * Admin declarations are read from Supabase through the Flask API.
 * Refreshing these APIs periodically makes DECLARE/UNDECLARE actions
 * appear on the student dashboard without requiring a manual refresh.
 */
let openedScriptQuizId = null;


setInterval(
    refreshDeclarationAreas,
    10000
);

</script>

</body>
